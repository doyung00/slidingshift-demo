<title>슬라이딩시프트 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#F8F9FC; --ink:#161A26; --ink2:#3A4152; --muted:#6B7385; --line:#E4E7EE;
  --brand:#5146E5; --brand-weak:#ECEBFF; --brand-ink:#3A30C2;
  --red:#E5484D; --red-weak:#FDECEC; --orange:#F2711C; --orange-weak:#FFF1E7;
  --amber:#D99A00; --amber-weak:#FFF6DB; --green:#12A150; --green-weak:#E5F7EC;
  --blue:#2F6FEB; --blue-weak:#E8F0FE; --violet:#7C3AED; --violet-weak:#F2EBFF; --gray-weak:#EEF0F4;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 4px 16px rgba(20,24,40,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1117; --surface:#181B24; --surface2:#1E222D; --ink:#EEF0F6; --ink2:#C9CEDB; --muted:#8C93A6; --line:#2A2F3C;
    --brand:#7B72FF; --brand-weak:#26244A; --brand-ink:#B3ADFF;
    --red-weak:#3A1D20; --orange-weak:#3A2616; --amber-weak:#3A3014; --green-weak:#15301F; --blue-weak:#172946; --violet-weak:#2A1E45; --gray-weak:#252A36;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1117; --surface:#181B24; --surface2:#1E222D; --ink:#EEF0F6; --ink2:#C9CEDB; --muted:#8C93A6; --line:#2A2F3C;
  --brand:#7B72FF; --brand-weak:#26244A; --brand-ink:#B3ADFF;
  --red-weak:#3A1D20; --orange-weak:#3A2616; --amber-weak:#3A3014; --green-weak:#15301F; --blue-weak:#172946; --violet-weak:#2A1E45; --gray-weak:#252A36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh;height:100dvh}
.app.with-phone{grid-template-columns:232px 1fr 360px}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#9B5CF6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.logo b{font-size:16px;display:block;line-height:1.2}
.logo small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);font-weight:500;width:100%;text-align:left;position:relative}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--brand-weak);color:var(--brand-ink);font-weight:700}
.nav .ic{width:22px;text-align:center;font-size:17px}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
.side .foot button{color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--surface);border-bottom:1px solid var(--line)}
.store{font-weight:700;white-space:nowrap}
.store small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.top .grow{flex:1}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{filter:brightness(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.content{flex:1;overflow:auto;padding:24px 26px 40px}
.h1{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.sec-t{font-weight:800;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
/* banner */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--orange-weak);color:var(--ink);margin-bottom:16px;font-weight:500}
.banner.info{background:var(--brand-weak)}
.banner .x{margin-left:auto}
/* cards */
.filters{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.fbtn{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.fbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hcard{padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden}
.hcard:hover{transform:translateY(-2px)}
.hcard.urgent{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.hcard.urgent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.hcard.done{opacity:.62}
.hcard.newin{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.94);box-shadow:0 0 0 6px var(--brand-weak)}100%{transform:none}}
.tline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.type{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.red{background:var(--red-weak);color:var(--red)}
.tag.orange{background:var(--orange-weak);color:var(--orange)}
.tag.gray{background:var(--gray-weak);color:var(--muted)}
.tag.brand{background:var(--brand-weak);color:var(--brand-ink)}
.hcard .title{font-weight:800;font-size:16.5px;line-height:1.35}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0;color:var(--ink2);font-weight:500}
.hcard .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-0{background:var(--gray-weak);color:var(--muted)} .st-1{background:var(--blue-weak);color:var(--blue)} .st-2{background:var(--violet-weak);color:var(--violet)} .st-3{background:var(--amber-weak);color:var(--amber)} .st-4{background:var(--green-weak);color:var(--green)}
/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);transition:all .2s}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gray-weak);font-size:12px}
.step.past{color:var(--ink2)} .step.past .n{background:var(--brand);color:#fff}
.step.cur{border-color:var(--brand);background:var(--brand-weak);color:var(--brand-ink)} .step.cur .n{background:var(--brand);color:#fff}
.step:hover{border-color:var(--brand)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.field .v{font-weight:700;font-size:14.5px}
.field input,.field select{width:100%;border:0;background:transparent;font-weight:700;font-size:14.5px;padding:0;outline:none}
.field.miss{border:1.5px dashed var(--orange);background:var(--orange-weak)}
.field.wide{grid-column:1/-1}
.origin{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.origin .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-weak);display:grid;place-items:center;font-size:19px;flex:none}
.quote{font-size:14px;color:var(--ink2)}
.audio{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.audio .bars{display:flex;gap:2px;align-items:center;height:16px}
.audio .bars i{width:3px;background:var(--brand);border-radius:2px;opacity:.6}
/* manual */
.mlink{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--brand-weak),var(--surface));border:1px solid var(--line);width:100%;text-align:left}
.mlink .ic{font-size:24px}
.mlink b{display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mcard{padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.steps li .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800;font-size:13px}
.steps li.ok{background:var(--green-weak);border-color:transparent}
.steps li.ok .n{background:var(--green)}
.steps li.ok span{text-decoration:line-through;color:var(--muted)}
.warn{background:var(--red-weak);border-radius:12px;padding:12px 14px;font-size:14px}
.warn li{margin:2px 0}
.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.terms dt{font-weight:800;color:var(--brand-ink)} .terms dd{margin:0;color:var(--ink2)}
.plan{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.plan .z{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.plan .z.hl{fill:var(--brand-weak);stroke:var(--brand);stroke-width:2.5}
.plan text{font-size:11px;fill:var(--muted);font-family:inherit;font-weight:500}
.plan text.hl{fill:var(--brand-ink);font-weight:800}
.plan .pulse{fill:var(--brand);transform-origin:center;transform-box:fill-box;animation:pl 1.4s infinite}
@keyframes pl{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.video{aspect-ratio:16/9;border-radius:12px;background:#1d2030;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.video .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
.video small{position:absolute;left:12px;bottom:10px;opacity:.8}
/* chat */
.chat{display:flex;flex-direction:column;height:100%;min-height:340px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:12px;border:1px solid var(--line);min-height:220px;max-height:420px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11.5px;color:var(--muted)}
.msg .bub{padding:9px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--brand);color:#fff;border-color:var(--brand)}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .bub{background:transparent;border:0;color:var(--muted);font-size:12px;padding:2px}
.msg.new{animation:pop .5s ease}
.typing .bub{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
.send{display:flex;gap:8px;margin-top:10px}
.send input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);outline:none}
.send input:focus{border-color:var(--brand)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px;align-items:center}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14.5px;min-width:112px;position:relative}
.pbtn small{font-weight:500;font-size:11.5px;color:var(--muted)}
.pbtn.on{border-color:var(--brand);background:var(--brand-weak);color:var(--brand-ink)}
.pbtn .now{position:absolute;top:-8px;right:8px;font-size:10.5px;font-weight:800;background:var(--brand);color:#fff;border-radius:99px;padding:1px 7px}
.pbtn .n{position:absolute;top:8px;right:10px;font-size:11.5px;color:var(--muted);font-weight:700}
.cal .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:2px 0}
.cal .cd{min-height:68px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:5px;display:flex;flex-direction:column;gap:2px;text-align:left;overflow:hidden}
.cal .cd.empty{border:0;background:transparent}
.cal .cd.past{background:var(--surface2)}
.cal .cd.today{border-color:var(--brand);border-width:2px}
.cal .cd.sel{box-shadow:0 0 0 3px var(--brand-weak);border-color:var(--brand)}
.cal .dn{font-size:12.5px;font-weight:800;color:var(--ink)}
.cal .ev{font-size:10.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:10.5px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}
.calit{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;font-size:14px;background:var(--surface)}
.ings.stock td{font-size:14px;padding:8px 4px} .ings.stock td:last-child{font-weight:700;color:var(--ink2)}
.alog.pay td{padding:7px 8px;white-space:nowrap}
.alog.pay td:first-child{white-space:normal}
.tag{white-space:nowrap}
.modal.pinbox{width:min(360px,100%);text-align:center}
#staff .d{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11.5px;font-weight:800;flex:none}
.pinbox.err{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pdots{display:flex;gap:14px;justify-content:center;margin:20px 0 6px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent}
.pdots i.on{background:var(--ink);border-color:var(--ink)}
.pinbox.err .pdots i{border-color:var(--red)}
.perr{color:var(--red);font-size:12.5px;font-weight:700;margin:0 0 8px;min-height:18px}
.pkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkeys button{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.pkeys button:active{background:var(--line)}
.wage{width:84px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);text-align:right}
.bk{gap:7px;font-size:12.5px}
.bk i.ok{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-weak)}
.bk i.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand);border-top-color:transparent;animation:spin .7s linear infinite}
.bk.saving{color:var(--brand-ink);border-color:var(--brand)}
.bkrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media (max-width:1400px){.with-phone .top .chip.hide-m{display:none}}
.top{flex-wrap:wrap;row-gap:8px}
@media (max-width:760px){.cal .cd{min-height:44px}.cal .ev{display:none}.cal .grid2{grid-template-columns:1fr!important}.bk{display:none}}
.promo{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:linear-gradient(110deg,#FF6B6B,#F2711C);color:#fff;margin-bottom:10px;font-size:14px;box-shadow:var(--shadow)}
.promo .em{font-size:24px}
.promo b{font-size:15px}
.promo ul{margin:2px 0 0;padding-left:18px}
.promo .dday{margin-left:auto;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 11px;font-weight:800;font-size:12.5px;white-space:nowrap}
.pin{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--amber-weak);margin-bottom:12px;font-size:14px}
.threads{display:flex;flex-direction:column;gap:6px}
.thr{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent}
.thr:hover{background:var(--surface2)}
.thr.on{background:var(--brand-weak);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.thr .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* record */
.recbig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.rb{padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-radius:20px}
.rb .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:36px}
.rb b{font-size:19px}
.rb small{color:var(--muted)}
.rb:hover{border-color:var(--brand)}
.recwrap{max-width:760px;margin:0 auto;text-align:center;padding:30px}
.mic{width:130px;height:130px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:16px auto;color:#fff;font-size:50px;position:relative}
.mic::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--red);opacity:.4;animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:52px;margin:6px 0 14px}
.wave i{width:5px;border-radius:3px;background:var(--brand);animation:wv 0.9s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:46px}}
.transcript{min-height:84px;font-size:19px;font-weight:500;line-height:1.6;padding:16px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.transcript .cur{display:inline-block;width:2px;height:20px;background:var(--brand);vertical-align:middle;animation:tp .8s infinite}
.ai-steps{list-style:none;padding:0;margin:20px auto;max-width:420px;text-align:left;display:flex;flex-direction:column;gap:10px}
.ai-steps li{display:flex;gap:12px;align-items:center;font-size:16px;color:var(--muted);transition:color .2s}
.ai-steps li .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.ai-steps li.run{color:var(--ink)} .ai-steps li.run .d{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.ai-steps li.ok{color:var(--ink)} .ai-steps li.ok .d{background:var(--green);border-color:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

.ph{border-radius:14px;overflow:hidden;border:2px solid var(--line);text-align:left;background:var(--surface)}
.ph:hover{border-color:var(--brand)}
.ph svg{display:block;width:100%;height:auto}
.ph div{padding:8px 10px;font-size:13px;font-weight:500}
textarea.big{width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;background:var(--surface);outline:none;resize:vertical}
textarea.big:focus{border-color:var(--brand)}
.ask{border-radius:14px;padding:14px 16px;background:var(--orange-weak);border:1.5px solid color-mix(in srgb,var(--orange) 40%,transparent)}
.ask b{display:flex;gap:8px;align-items:center}
.ask .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ask .opts button{padding:8px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.ask .opts button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.ai-tag{font-size:11.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-weak);padding:2px 8px;border-radius:99px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,var(--brand-weak),transparent),var(--bg)}
.lbox{width:min(880px,100%);padding:34px}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 10px}
.wbtn{padding:22px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.wbtn:hover{border-color:var(--brand)}
.wbtn.next{border-color:var(--brand);box-shadow:0 0 0 5px var(--brand-weak)}
.wbtn .av{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff}
.wbtn b{font-size:18px}
.wbtn small{color:var(--muted)}
.wbtn .nb{position:absolute;top:10px;right:10px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;padding:26px;border-radius:20px;background:var(--surface)}
.hand{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.hand .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.hand .it.go{animation:slide .7s ease both}
@keyframes slide{0%{transform:translateX(0);opacity:1}60%{transform:translateX(24px);opacity:.3}100%{transform:none;opacity:1}}
/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:500;font-size:14px;box-shadow:var(--shadow);animation:up .3s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{padding:16px}
.kpi small{color:var(--muted);font-weight:500;font-size:12.5px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .d{font-size:12.5px;font-weight:700}
.up{color:var(--green)} .dn{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.col{background:var(--surface2);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;font-weight:500;margin-bottom:6px}
.faq{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
.faq .q{font-weight:700}
.faq .c{font-size:12.5px;color:var(--muted)}
.faq .btn{margin-left:auto}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:10px 6px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bars .b i{width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:var(--brand);display:block}
.bars .b.before i{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.bars .b em{font-style:normal;font-weight:800;color:var(--ink);font-size:13px}
/* phone */
.phone-wrap{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 14px;height:100vh;overflow:hidden}
.phone-wrap .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:lv 1.6s infinite}
@keyframes lv{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}100%{box-shadow:0 0 0 8px rgba(18,161,80,0)}}
.phone{width:320px;flex:1;max-height:700px;border-radius:40px;border:10px solid #111;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone .notch{width:110px;height:24px;background:#111;border-radius:0 0 14px 14px;margin:0 auto}
.phone .ph-top{padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.phone .ph-top b{font-size:15px}
.phone .tabs{display:flex;gap:6px;margin-top:8px}
.phone .tabs button{flex:1;padding:6px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--surface2)}
.phone .tabs button.on{background:var(--ink);color:var(--surface)}
.phone .body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.noti{padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:13px}
.noti b{display:block;font-size:13px}
.noti small{color:var(--muted);font-size:11px}
.noti.new{animation:pop .6s ease;border-color:var(--brand)}
.phone .msgs{max-height:none;min-height:0;border:0;padding:6px;background:transparent}
.phone .send{padding:8px;margin:0;border-top:1px solid var(--line)}
.phone .send input{padding:9px 12px;font-size:13px}
.phone .msg .bub{font-size:13px}
.banner-push{position:absolute;left:8px;right:8px;top:30px;background:rgba(30,32,44,.94);color:#fff;border-radius:16px;padding:10px 12px;font-size:12.5px;z-index:5;animation:drop .4s ease}
.banner-push b{display:block;font-size:12px;opacity:.8}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.help{position:fixed;right:14px;bottom:14px;z-index:40}
.kbd{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface2)}
/* [테스트] 출퇴근 */
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:18px 0 6px}
.atc{padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.atc.on{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.atc.next{border-color:var(--brand);box-shadow:0 0 0 5px var(--brand-weak)}
.atc .who{display:flex;gap:12px;align-items:center}
.atc .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:800;color:#fff;flex:none}
.atc b{font-size:17px;display:block}
.atc small{color:var(--muted);font-size:12.5px}
.atc .btns{display:flex;gap:8px}
.atc .btns .btn{flex:1;padding:9px 10px}
.duty{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap}
.duty .d{width:22px;height:22px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.duty.on{border-color:var(--brand);background:var(--brand-weak);color:var(--brand-ink)}
.alog{width:100%;border-collapse:collapse;font-size:14px}
.alog th,.alog td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.alog th{color:var(--muted);font-weight:500;font-size:12.5px}
/* [테스트] 매뉴얼 카테고리 · 레시피 */
.ctabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.ctab{padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.ctab em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}
.ctab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)} .ctab.on em{color:inherit;opacity:.7}
.msearch{width:100%;max-width:360px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);outline:none;margin-bottom:14px}
.mgroup{margin:4px 0 22px}
.rcard .em{font-size:30px;line-height:1}
.vtabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.vtabs button{padding:7px 16px;border-radius:9px;font-weight:800;font-size:14px}
.vtabs button.on{background:var(--surface);box-shadow:var(--shadow)}
.vtabs button.hot.on{color:var(--red)} .vtabs button.ice.on{color:var(--blue)}
.ings{width:100%;border-collapse:collapse;font-size:15px}
.ings td{padding:10px 4px;border-bottom:1px dashed var(--line)}
.ings td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.cupwrap{display:flex;gap:16px;align-items:center}
.cupwrap svg{width:130px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.rlinks{display:flex;gap:8px;flex-wrap:wrap}
.rlinks button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
/* [테스트] 단체방 + 기록 */
.room{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.room .msgs{max-height:none;flex:none;height:calc(100vh - 420px);min-height:300px}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools .btn{padding:8px 12px;font-size:13.5px}
.mcardmsg{display:flex;flex-direction:column;gap:6px;text-align:left;padding:11px 13px;border-radius:14px;border:1.5px solid var(--brand);background:var(--surface);min-width:240px;font-size:13.5px}
.mcardmsg b{font-size:14.5px}
.ctag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--brand-weak);color:var(--brand-ink);margin-bottom:3px;cursor:pointer}
.suggest{align-self:center;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--amber-weak);font-size:13px;max-width:100%;flex-wrap:wrap}
.suggest .btn{padding:6px 10px;font-size:12.5px}
.mem{display:flex;gap:10px;align-items:center;padding:7px 4px;font-size:14px}
.mem .d{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.testbadge{position:fixed;left:50%;top:0;transform:translateX(-50%);background:#F2711C;color:#fff;font-size:11.5px;font-weight:800;padding:3px 12px;border-radius:0 0 10px 10px;z-index:90;letter-spacing:.2px;pointer-events:none}
/* responsive */
@media (max-width:1100px){.room{grid-template-columns:1fr}.app.with-phone{grid-template-columns:200px 1fr 340px}.side{padding:16px 8px}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app,.app.with-phone{grid-template-columns:1fr;height:auto}
  .side{position:fixed;bottom:0;left:0;right:0;flex-direction:row;padding:6px;z-index:30;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .side .logo,.side .sep,.side .foot,.nav .lb{display:none}
  .nav{flex-direction:column;gap:2px;padding:8px;width:auto;font-size:11px}
  .nav .lbm{display:block;font-size:10.5px}
  .main{height:auto;min-height:100vh;padding-bottom:70px}
  .top{padding:12px 16px;flex-wrap:wrap}
  .content{padding:16px 16px 90px}
  .phone-wrap{display:none}
  .recbig,.wk{grid-template-columns:1fr}
  .room .msgs{height:55vh}
  .cupwrap{flex-direction:column;align-items:flex-start}
  .fields{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  .stepper{grid-template-columns:repeat(5,1fr)}
  .step{font-size:11px;padding:8px 2px}
  .hide-m{display:none}
}
.nav .lbm{display:none}
</style>

<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script>
/* ===================== 데이터 ===================== */
const STATUS=['신규','확인','담당','처리 중','완료'];
const TYPES={
  '재고·발주':{ic:'📦',c:'var(--blue)',bg:'var(--blue-weak)'},
  '장비 이상':{ic:'🛠️',c:'var(--red)',bg:'var(--red-weak)'},
  '주문·예약':{ic:'🧾',c:'var(--violet)',bg:'var(--violet-weak)'},
  '청소·위생':{ic:'🧽',c:'var(--green)',bg:'var(--green-weak)'},
  '기타':{ic:'📌',c:'var(--muted)',bg:'var(--gray-weak)'}
};
/* [테스트] 매뉴얼 카테고리 */
const CATS={
  recipe:{l:'음료 레시피',ic:'🥤',c:'var(--orange)',bg:'var(--orange-weak)'},
  food:{l:'케이크·샌드위치',ic:'🍰',c:'#D6336C',bg:'color-mix(in srgb,#D6336C 12%,transparent)'},
  order:{l:'주문·결제',ic:'🧾',c:'var(--violet)',bg:'var(--violet-weak)'},
  equip:{l:'장비',ic:'🛠️',c:'var(--red)',bg:'var(--red-weak)'},
  clean:{l:'청소',ic:'🧽',c:'var(--green)',bg:'var(--green-weak)'},
  etc:{l:'기타',ic:'📌',c:'var(--muted)',bg:'var(--gray-weak)'}
};
/* 재고 위치: 창고·냉장고 선반 칸 단위 */
const STORE_MAP=[
  {name:'원두 (하우스 블렌드 1kg)',place:'창고',shelf:'왼쪽',lv:2,note:'유통기한 빠른 봉투를 앞으로'},
  {name:'종이컵 12oz / 16oz',place:'창고',shelf:'왼쪽',lv:4,note:'카운터 하부 수납장이 비면 여기서 보충'},
  {name:'뚜껑 · 빨대 · 홀더',place:'창고',shelf:'왼쪽',lv:3},
  {name:'바닐라 · 카라멜 시럽 여분 (1L)',place:'창고',shelf:'오른쪽',lv:1,note:'흰 라벨 = 바닐라, 갈색 = 카라멜'},
  {name:'초코 소스 여분',place:'창고',shelf:'오른쪽',lv:2},
  {name:'오트밀크 · 두유',place:'창고',shelf:'오른쪽',lv:3,note:'우유와 다른 거래처 (6팩 단위 발주)'},
  {name:'녹차 · 아이스티 파우더',place:'창고',shelf:'가운데',lv:2,note:'녹색 라벨 박스'},
  {name:'영수증 용지',place:'창고',shelf:'가운데',lv:1,note:'흰 상자 · 3롤 이하면 알리기'},
  {name:'제빙기 정수 필터',place:'창고',shelf:'가운데',lv:4},
  {name:'탄산수 (24캔 박스)',place:'창고',shelf:'바닥',lv:0,note:'문 옆 바닥'},
  {name:'우유 (1L)',place:'워크인 냉장고',shelf:'왼쪽',lv:2,note:'선입선출 · 3팩 이하면 발주'},
  {name:'자몽청 · 딸기청 · 유자청',place:'워크인 냉장고',shelf:'오른쪽',lv:1,note:'뚜껑 색: 주황 자몽 · 빨강 딸기 · 노랑 유자'},
  {name:'콜드브루 원액',place:'워크인 냉장고',shelf:'왼쪽',lv:1,note:'날짜 라벨 확인 (5일)'},
  {name:'케이크 · 샌드위치 여분',place:'워크인 냉장고',shelf:'오른쪽',lv:3}
];
const ORD=['','맨 위 칸','위에서 두 번째 칸','위에서 세 번째 칸','맨 아래 칸'];
function storeText(x){return x.lv===0?`${x.place} ${x.shelf}`:`${x.place} ${x.shelf} 선반 ${ORD[x.lv]}`}
function shelfSVG(place,hl){
  const cols=place==='창고'?['왼쪽','가운데','오른쪽']:['왼쪽','오른쪽'];
  const W_=place==='창고'?300:210, colW=(W_-20)/cols.length;
  let s=`<svg viewBox="0 0 ${W_} 200" class="plan" role="img" aria-label="${place} 선반">`;
  cols.forEach((c,i)=>{const x=10+i*colW;
    s+=`<text x="${x+colW/2}" y="14" text-anchor="middle">${c} 선반</text>`;
    for(let lv=1;lv<=4;lv++){const y=20+(lv-1)*40, on=hl&&hl.place===place&&hl.shelf===c&&hl.lv===lv;
      s+=`<rect class="z ${on?'hl':''}" x="${x+4}" y="${y}" width="${colW-8}" height="34" rx="5"/>`;
      if(on)s+=`<circle class="pulse" cx="${x+colW/2}" cy="${y+17}" r="7"/><circle cx="${x+colW/2}" cy="${y+17}" r="5" fill="var(--brand)"/>`;
      else s+=`<text x="${x+colW/2}" y="${y+21}" text-anchor="middle" style="font-size:9px">${lv}칸</text>`}});
  if(place==='창고'){const on=hl&&hl.shelf==='바닥';s+=`<rect class="z ${on?'hl':''}" x="10" y="182" width="${W_-20}" height="14" rx="4"/><text x="${W_/2}" y="193" text-anchor="middle" style="font-size:9px" class="${on?'hl':''}">바닥 (문 옆)</text>`}
  return s+`</svg>`;
}
function stockView(){
  const q=(S.mq||'').trim(), L=STORE_MAP.map((x,i)=>({...x,i})).filter(x=>!q||x.name.includes(q)||x.place.includes(q));
  const sel=STORE_MAP[S.stockSel??0];
  return `<div class="grid2" style="grid-template-columns:1.2fr 1fr"><section class="panel" style="padding:18px"><div class="sec-t">📦 재료별 보관 위치 <span class="muted" style="font-weight:500;font-size:13px">누르면 오른쪽 그림에 표시돼요</span></div>

  const LOCS=['워크인 냉장고','냉장고','냉동고','창고','카운터','포스','에스프레소 머신','그라인더','제빙기','스팀 노즐','그룹','화장실','홀','테라스','오븐','쇼케이스','선반'];

  const dm=t.match(/(오늘|내일|모레|이번 ?주|주말|[월화수목금토일]요일)?\s*(오전|오후)?\s*(\d{1,2}|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|열한|열두)\s*시\s*(반)?\s*(전|까지)?/);
  let due='';
  if(dm&&dm[0].trim().length>1){due=dm[0].trim().replace(/(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)(?=\s*시)/,m=>({'한':1,'두':2,'세':3,'네':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10,'열한':11,'열두':12}[m]))}
  else{const d2=t.match(/오늘|내일|모레|이번 ?주|주말/);if(d2)due=d2[0]}
  let first=t.split(/[.!?。\n]/)[0].trim(); if(first.length>26)first=first.slice(0,25)+'…';
  const nextMap={'재고·발주':'수량 확인 후 발주','장비 이상':'사용 중지 표시 후 사장님께 알리기','주문·예약':'예약 내용 확인 · 준비물 체크','청소·위생':'청소 후 완료 체크','기타':'내용 확인 후 처리'};
  const manMap={'재고·발주':'m-milk','장비 이상':'m-espresso','주문·예약':'m-group','청소·위생':'m-grinder','기타':null};
  return {type,title:first||'새 인수인계',qty:qty||'-',loc,next:nextMap[type],due,urgent:/급|빨리|당장|지금/.test(t),manual:manMap[type],
    ask:!due?{q:'언제까지 처리해야 하나요?',opts:['오늘 중','다음 교대 시작 전','이번 주 안','급하지 않음']}:(!loc?{q:'어디에서 생긴 일인가요?',opts:['카운터·포스','에스프레소 머신','워크인 냉장고','창고'],field:'loc'}:null)};
}

   <p style="font-size:18px;font-weight:700;margin:26px 0 0">출근할 때 이름을 누르세요 · 지금 <span style="color:var(--green)">${duty.length}명</span> 근무 중</p>
   <p class="muted" style="margin:4px 0 0">여러 명이 함께 근무해도 괜찮아요. 출근한 사람은 위쪽 이름표를 눌러 패드를 바꿔 쓰고, 퇴근할 때 남은 일이 다음 근무자에게 넘어가요.</p>
   <div class="att">${active().map(cardOf).join('')}</div>
   <div class="grid2" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <div class="banner info" style="margin:0;align-self:start">📋 확인할 인수인계 카드 <b>${carry}개</b>가 기다리고 있어요.</div>
    <div class="panel" style="padding:12px 14px;box-shadow:none"><div class="sec-t" style="margin-bottom:4px">🕘 오늘 출퇴근 기록</div>${attTable(4)}</div>
   </div>
  </div></div>`;
}
function attTable(limit){

function clockIn(id){

function useAs(id){S.worker=id;S.view='home';S.filter='all';render();toast(`${W(id).name}님으로 패드를 사용해요`)}

/* ---- 홈 ---- */

   <div class="row"><button class="btn lg" onclick="go('chat')">💬 단체방</button><button class="btn primary lg" onclick="S.recFrom='home';startVoice()">🎙️ 음성으로 기록</button></div></div>
  <div class="parts"><span class="muted" style="font-size:13px;font-weight:700;margin-right:2px">공용 · 파트별</span><button class="pbtn ${P==='all'?'on':''}" onclick="S.part='all';render()">📋 전체<small>모든 파트</small></button>${Object.keys(PARTS).map(pb).join('')}</div>

/* [7단계] 달력: 위생점검 · 단체 일정 · 미해결 이월 카드 */
const EVK={hygiene:{l:'위생점검',c:'var(--green)'},group:{l:'단체·모임',c:'var(--violet)'},promo:{l:'행사',c:'var(--orange)'},etc:{l:'기타',c:'var(--blue)'},card:{l:'미해결 카드',c:'var(--red)'}};
function dayItems(d){
  const ev=S.events.filter(e=>e.d===d).map(e=>({...e}));
  const cs=S.cards.filter(c=>c.status<4&&c.dueDay===d).map(c=>({d,title:c.title,kind:'card',card:c.id,carry:c.carry}));
  return [...cs,...ev];
}
function calendar(){
  const now_=new Date(S.clock), Y=now_.getFullYear(), M=now_.getMonth(), today=now_.getDate();
  const first=new Date(Y,M,1).getDay(), days=new Date(Y,M+1,0).getDate();
  const sel=S.calSel||today;
  let cells='';for(let i=0;i<first;i++)cells+='<div class="cd empty"></div>';
  for(let d=1;d<=days;d++){const it=dayItems(d), dow=(first+d-1)%7;
    cells+=`<button class="cd ${d===today?'today':''} ${d===sel?'sel':''} ${d<today?'past':''}" onclick="S.calSel=${d};render()"><span class="dn" ${dow===0?'style="color:var(--red)"':dow===6?'style="color:var(--blue)"':''}>${d}</span>${it.slice(0,2).map(e=>`<span class="ev" style="--c:${EVK[e.kind].c}">${e.kind==='card'?'⚠ ':''}${esc(e.title)}</span>`).join('')}${it.length>2?`<span class="more">+${it.length-2}</span>`:''}</button>`}
  const items=dayItems(sel);
  const overdue=S.cards.filter(c=>c.status<4&&(c.carry>0||(c.dueDay&&c.dueDay<today)));
  return `<section class="panel cal" style="margin-top:22px;padding:18px">
   <div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="sec-t" style="margin:0">📅 ${M+1}월 일정</div><div class="row" style="gap:10px">${Object.values(EVK).map(k=>`<span class="muted" style="font-size:12px"><i class="dot" style="background:${k.c}"></i>${k.l}</span>`).join('')}</div></div>
   <div class="calgrid">${['일','월','화','수','목','금','토'].map((w,i)=>`<div class="wd" ${i===0?'style="color:var(--red)"':i===6?'style="color:var(--blue)"':''}>${w}</div>`).join('')}${cells}</div>
   <div class="grid2" style="margin-top:14px;grid-template-columns:1fr 1fr">
    <div><div class="sec-t">${M+1}/${sel} ${sel===today?'(오늘)':''}</div>${items.length?items.map(e=>`<div class="calit" ${e.card?`onclick="openCard('${e.card}')" style="cursor:pointer"`:''}><i class="dot" style="background:${EVK[e.kind].c}"></i><b>${esc(e.title)}</b>${e.t?`<span class="muted">${esc(e.t)}</span>`:''}${e.card?`<span class="tag red" style="margin-left:auto">미해결${e.carry?` · ${e.carry}회 이월`:''}</span>`:`<button class="x muted" style="margin-left:auto" title="삭제" onclick="delEvent(${sel},'${esc(e.title).replace(/'/g,'')}')">✕</button>`}</div>`).join(''):'<p class="muted" style="margin:0;font-size:13.5px">일정이 없어요.</p>'}
     <form class="send" style="margin-top:10px" onsubmit="event.preventDefault();addEvent(${sel},this)"><select name="k" style="border:1px solid var(--line);border-radius:12px;padding:0 8px;background:var(--surface)">${['hygiene','group','promo','etc'].map(k=>`<option value="${k}">${EVK[k].l}</option>`).join('')}</select><input name="t" placeholder="${M+1}/${sel} 일정 추가 (예: 위생점검)" autocomplete="off"><button class="btn">추가</button></form></div>
    <div><div class="sec-t">⚠️ 해결 안 된 이월 카드 <span class="muted" style="font-weight:500;font-size:13px">${overdue.length}건</span></div>${overdue.length?overdue.map(c=>`<button class="calit" style="width:100%;text-align:left" onclick="openCard('${c.id}')"><i class="dot" style="background:var(--red)"></i><b>${esc(c.title)}</b><span class="muted" style="margin-left:auto;font-size:12.5px">${c.dueDay?`기한 ${M+1}/${c.dueDay}`:''}${c.carry?` · ${c.carry}회 이월`:''}</span></button>`).join(''):'<p class="muted" style="margin:0;font-size:13.5px">밀린 카드가 없어요 👍</p>'}</div>
   </div></section>`;
}
function addEvent(d,f){const t=f.t.value.trim();if(!t)return;S.events.push({d,title:t,kind:f.k.value});markDirty();notify('📅 일정 추가',`${new Date(S.clock).getMonth()+1}/${d} ${t}`);render()}
function delEvent(d,t){S.events=S.events.filter(e=>!(e.d===d&&e.title.replace(/'/g,'')===t));markDirty();render()}
function promoBar(){const P=S.promo;if(!P||!P.title)return '';
  return `<div class="promo"><span class="em">🎉</span><div><b>${esc(P.title)}</b><ul>${P.items.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${P.until?`<span class="dday">${esc(P.until)}</span>`:''}</div>`}
function cardMsgs(id){return S.room.filter(m=>m.card===id&&m.from!=='card')}
function hcard(c){
  const msgs=cardMsgs(c.id).length;
  return `<button class="panel hcard ${c.urgent&&c.status<4?'urgent':''} ${c.status===4?'done':''} ${c.fresh?'newin':''}" onclick="openCard('${c.id}')">

   <div class="title">${esc(c.title)}</div>
   <dl class="meta"><dt>수량</dt><dd>${esc(c.qty)}</dd><dt>위치</dt><dd>${esc(c.loc||'-')}</dd><dt>기한</dt><dd ${c.urgent&&c.status<4?'style="color:var(--red)"':''}>${esc(c.due||'-')}</dd><dt>다음 행동</dt><dd>${esc(c.next)}</dd></dl>
   <div class="foot"><span>${c.src.kind==='voice'?'🎙️ 음성':'⌨️ 메모'} · ${esc(c.from)} · ${esc(c.at)}</span><span>${c.assignee?'👤 '+esc(c.assignee):''} ${msgs?'💬 '+msgs:''} ${c.manual?'📘':''}${c.recipes?' 🥤':''}</span></div></button>`;
}

/* ---- 카드 상세 ---- */
function openCard(id){const c=card(id);if(!c)return;c.fresh=false;if(c.status===0){c.status=1;c.seenBy=W(S.worker).name}S.sel=id;S.view='card';S.afterRender=scrollMsgs;render()}
function viewCard(){
  const c=card(S.sel), m=c.manual&&S.manuals[c.manual];
  const acts=[];

function origin(c){

function clearFresh(){S.room.forEach(m=>m.fresh=false)}
function push(m){clearFresh();m.id='m'+(++MID);m.t=m.t||now();m.fresh=true;S.room.push(m);return m}
function senderPick(){const d=onDuty();
  return `<div class="row" style="gap:6px;margin-top:10px"><span class="muted" style="font-size:12.5px;font-weight:700">보내는 사람</span>${d.map(w=>`<button class="duty ${w.id===S.worker?'on':''}" onclick="switchUser('${w.id}')">${av(w)}${w.name}</button>`).join('')}<button class="duty" style="padding:4px 10px" onclick="go('attend')" title="출근한 사람 추가">＋ 출근</button></div>`}
function chatBox(cid){
  const L=cid?S.room.filter(m=>m.card===cid):S.room;
  const typing=S.typing&&(cid?S.typing===cid:true);
  const q=cid?['확인했어요','지금 처리 중이에요','도움이 필요해요']:['확인했습니다!','오픈 완료했어요','잠깐 자리 비워요','도움이 필요해요'];
  return `<div class="chat"><div class="msgs" id="msgs-${cid||'room'}">${L.length?L.map(m=>bubble(m,false,!!cid)).join(''):'<div class="msg sys"><div class="bub">아직 이 카드 이야기가 없어요. 급한 일은 여기서 바로 보내세요.</div></div>'}${typing?'<div class="msg typing"><span class="who">'+OWNER+'</span><div class="bub"><i></i><i></i><i></i></div></div>':''}</div>
  <div class="quick">${q.map(x=>`<button onclick="sendW('${x}',${cid?`'${cid}'`:'null'})">${x}</button>`).join('')}</div>
  ${senderPick()}<form class="send" onsubmit="event.preventDefault();sendW(this.m.value,${cid?`'${cid}'`:'null'});"><input name="m" id="msgin" placeholder="${cid?'이 카드에 대해 단체방에 보내기…':'단체방에 보내기… 예) 오트밀크 3팩 남음 내일까지 발주'}" autocomplete="off"><button class="btn primary">보내기</button></form>
  ${cid?'':`<div class="tools"><button class="btn" onclick="S.recFrom='chat';startVoice()">🎙️ 음성으로 기록</button><button class="btn" onclick="inputToCard()">📋 입력한 글을 인수인계 카드로</button><span class="muted" style="font-size:12.5px;align-self:center">기록은 AI가 카드로 정리해 이 방에 올려요</span></div>`}</div>`;
}
function bubble(m,ownerView,inCard){
  if(m.from==='sys')return `<div class="msg sys ${m.fresh?'new':''}"><div class="bub">${esc(m.text)}</div></div>`;
  if(m.from==='suggest'){if(ownerView)return '';
    return m.done?`<div class="msg sys"><div class="bub">✓ 인수인계 카드로 만들었어요</div></div>`:`<div class="suggest ${m.fresh?'msg new':''}">🤖 인수인계로 남겨 둘 내용 같아요. 카드로 만들면 다음 근무자에게도 넘어가요. <button class="btn primary" onclick="msgToCard('${m.ref}')">📋 카드로 만들기</button></div>`}
  const mine=ownerView?m.from==='owner':m.from!=='owner';
  const who=m.from==='owner'?'👑 '+OWNER:esc(m.who);
  if(m.from==='card'){const c=card(m.card);if(!c)return '';
    return `<div class="msg ${mine?'me':''} ${m.fresh?'new':''}"><span class="who">${who} · ${esc(m.t)} · 인수인계 카드를 남겼어요</span><button class="mcardmsg" ${ownerView?'':`onclick="openCard('${c.id}')"`}><span class="tline">${typeBadge(c.type)}${c.urgent&&c.status<4?'<span class="tag red">긴급</span>':''}<span style="margin-left:auto">${stBadge(c.status)}</span></span><b>${esc(c.title)}</b><span class="muted">기한 ${esc(c.due||'-')} · ${esc(c.next)}</span>${ownerView?'':'<span style="color:var(--brand-ink);font-weight:700;font-size:12px">📋 눌러서 카드 보기 ›</span>'}</button></div>`}
  const c=m.card&&card(m.card);
  const tag=c&&!inCard?`<span class="ctag" ${ownerView?'':`onclick="openCard('${c.id}')"`}>📎 ${esc(c.title)}</span>`:'';
  return `<div class="msg ${mine?'me':''} ${m.fresh?'new':''}"><span class="who">${who} · ${esc(m.t)}</span>${tag}<div class="bub">${esc(m.text)}</div></div>`;
}
function scrollMsgs(){document.querySelectorAll('.msgs').forEach(e=>e.scrollTop=e.scrollHeight)}
function sysMsg(text,cid){push({from:'sys',text,card:cid||null})}
function sendW(text,cid){
  text=(text||'').trim();if(!text)return;
  const me=W(S.worker).name;
  const m=push({from:'w',who:me,text,card:cid||null});
  const c=cid&&card(cid);
  notify(`💬 ${me}${c?' · '+c.title:' · 단체방'}`,text);
  let sug=false;
  if(!cid){const a=analyze(text);if(a.type!=='기타'){push({from:'suggest',ref:m.id});S.room[S.room.length-2].fresh=true;sug=true}}
  S.afterRender=scrollMsgs;render();
  // 점주 자동 응답 (데모 시나리오)
  const key=cid||'room';
  S.autoReplied=S.autoReplied||{};if(S.autoReplied[key])return;S.autoReplied[key]=true;
  let reply='확인했어요, 고마워요 👍';
  if(c&&c.manual==='m-espresso')reply='헉 고마워요! 수리 기사님 오늘 4시에 오시기로 했어요. 그때까지 2번 그룹은 쓰지 말아 주세요 🙏';
  else if(c&&c.type==='재고·발주')reply='고마워요! 주말 전이니까 16팩으로 넣어 주세요.';
  else if(!cid&&sug)reply='고마워요! 카드로 남겨 주면 다음 조도 놓치지 않아요 👍';
  else if(!cid)reply='좋아요 👍 다들 고마워요!';
  setTimeout(()=>{S.typing=key;S.phoneTyping=true;S.afterRender=scrollMsgs;render()},1400);
  setTimeout(()=>{S.typing=null;S.phoneTyping=false;ownerSend(reply,cid)},3600);
}
function ownerSend(text,cid){
  text=(text||'').trim();if(!text)return;
  push({from:'owner',text,card:cid||null});
  if(!(S.view==='chat'||(S.view==='card'&&S.sel===cid)))toast(`👑 사장님: ${text.slice(0,30)}${text.length>30?'…':''}`);
  S.afterRender=scrollMsgs;render();
}
function inputToCard(){
  const el=$('#msgin');const t=el&&el.value.trim();
  if(!t){toast('먼저 남길 내용을 입력해 주세요');el&&el.focus();return}

}
function msgToCard(mid){
  const m=S.room.find(x=>x.id===mid);if(!m)return;
  S.recFrom='chat';S.fromMsg=mid;
  runAI({kind:'text',text:m.text},analyze(m.text),['단체방 메시지 이해','문제 유형 분류','수량 · 위치 · 기한 추출','빠진 정보 확인','관련 업무 매뉴얼 연결']);
}

/* ---- 기록 (음성 · 글) ---- */
function backRec(){return S.recFrom||'chat'}
/* 녹음 버튼 → 바로 브라우저 내장 음성 인식(Web Speech API). 지원 안 되면 기본 시나리오로 */
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){S.rec={text:'',done:false,live:true,err:'unsupported',t0:Date.now()};S.view='rec-voice';render();return}
  startLiveVoice();
}
function startScripted(){
  stopSR();S.rec={text:'',done:false,live:false};S.view='rec-voice';render();
  let i=0;clearInterval(S.recTimer);
  S.recTimer=setInterval(()=>{ if(S.view!=='rec-voice'){clearInterval(S.recTimer);return}
    i+=2;S.rec.text=SCRIPT_VOICE.slice(0,i);
    const el=$('#tr');if(el)el.innerHTML=esc(S.rec.text)+'<span class="cur"></span>';
    const sec=$('#rsec');if(sec)sec.textContent='0:'+String(Math.min(12,Math.floor(i/6))).padStart(2,'0');
    if(i>=SCRIPT_VOICE.length){clearInterval(S.recTimer);S.rec.done=true;const b=$('#stopb');if(b){b.classList.add('primary');b.textContent='■ 녹음 끝내고 AI로 정리하기'}}
  },70);
}
function stopSR(){if(S.sr){const r=S.sr;S.sr=null;r.onend=null;try{r.stop()}catch(e){}}}
function startLiveVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  clearInterval(S.recTimer);stopSR();
  S.rec={text:'',base:'',done:false,live:true,t0:Date.now()};S.view='rec-voice';render();
  const showText=t=>{const el=$('#tr');if(el)el.innerHTML=t?esc(t)+'<span class="cur"></span>':'<span class="muted">말씀하세요… 듣고 있어요</span><span class="cur"></span>'};
  showText('');
  S.recTimer=setInterval(()=>{if(S.view!=='rec-voice'){clearInterval(S.recTimer);stopSR();return}
    const sec=Math.floor((Date.now()-S.rec.t0)/1000);const e=$('#rsec');if(e)e.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},250);
  const begin=()=>{
    const r=new SR();r.lang='ko-KR';r.interimResults=true;r.continuous=true;S.sr=r;
    r.onresult=e=>{let fin='',tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}
      if(fin)S.rec.base=(S.rec.base+' '+fin.trim()).trim();
      S.rec.text=(S.rec.base+' '+tmp.trim()).trim();showText(S.rec.text)};
    r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){S.sr=null;r.onend=null;clearInterval(S.recTimer);S.rec.err=e.error;render()}};
    // 말이 잠깐 끊기면 크롬이 인식을 멈추므로, 녹음 중이면 자동으로 다시 시작
    r.onend=()=>{if(S.sr===r&&S.view==='rec-voice'){try{begin()}catch(e){}}};
    try{r.start()}catch(e){}
  };
  begin();
}
const SR_ERR={
  'unsupported':['이 브라우저는 음성 인식을 지원하지 않아요','데모 링크를 <b>크롬(Chrome)</b>이나 엣지에서 열어 주세요. 앱 안의 미리보기·카톡 브라우저·사파리에서는 동작하지 않아요.'],
  'not-allowed':['마이크 사용이 막혀 있어요','주소창 왼쪽 🔒(또는 🎙️) 아이콘 → <b>마이크 허용</b>으로 바꾼 뒤 다시 시도해 주세요. 다른 앱 안의 미리보기 화면이라면 크롬에서 직접 열어 주세요.'],
  'service-not-allowed':['이 브라우저에서 음성 인식 서비스를 쓸 수 없어요','크롬에서 열어 주세요 (브레이브 등 일부 브라우저는 막혀 있어요).'],
  'audio-capture':['마이크를 찾을 수 없어요','컴퓨터에 마이크가 연결돼 있는지, 다른 프로그램이 쓰고 있지 않은지 확인해 주세요.'],
  'network':['음성 인식 서버에 연결하지 못했어요','크롬 음성 인식은 인터넷이 필요해요. 연결을 확인하고 다시 시도해 주세요.']
};
function viewVoice(){
  const live=S.rec&&S.rec.live;
  if(S.rec&&S.rec.err){const [t,d]=SR_ERR[S.rec.err]||['음성 인식을 시작하지 못했어요',esc(S.rec.err)];
    return `<div class="recwrap"><div style="font-size:46px">🎙️</div><h1 class="h1">${t}</h1><p class="sub" style="max-width:560px;margin:6px auto 20px">${d}</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="go(backRec())">취소</button>${S.rec.err!=='unsupported'?'<button class="btn primary lg" onclick="startLiveVoice()">↺ 다시 시도</button>':''}<button class="btn lg" onclick="startScripted()">▶ 기본 시나리오로 시연</button></div></div>`}
  return `<div class="recwrap"><h1 class="h1">듣고 있어요…</h1><p class="sub">편하게 말하세요. 수량·위치·기한은 AI가 찾아내고, 정리된 카드는 단체방에 올라가요.</p>
  <div class="mic">🎙️</div><div class="wave">${Array.from({length:22},(_,i)=>`<i style="animation-delay:${(i%7)*.11}s"></i>`).join('')}</div>
  <div class="muted" style="margin-bottom:8px">● 녹음 중 <b id="rsec">0:00</b> ${live?'· 실시간 음성 인식':'· 기본 시나리오'}</div>
  <div class="transcript" id="tr">${esc(S.rec.text)}<span class="cur"></span></div>

function mMatch(m,q){if(!q)return true;q=q.trim();const hay=[m.title,m.sub||'',m.locText,...(m.stock||[]).flat(),...(m.steps||[]),...(m.vars?Object.values(m.vars).flatMap(v=>v.ings.map(x=>x[0])):[])].join(' ');return hay.includes(q)}

  return `<button class="panel mcard" onclick="openManual('${k}','list')"><div class="tline">${catBadge(m.cat)}${m.isNew?'<span class="tag brand">NEW · 질문에서 생성</span>':''}</div><b style="font-size:16px">${esc(m.title)}</b><span class="muted" style="font-size:13px">📍 ${esc(m.locText)}</span><span class="muted" style="font-size:12.5px">${m.steps.length}단계${m.stock?` · 📦 재고 ${m.stock.length}`:''}${VIDEO_CATS.includes(m.cat)&&m.video!==false?' · 🎬 영상':''} · 조회 ${m.views}회</span></button>`;

function mlistHTML(){

  const LATE={jy:{4:8,12:12},hn:{13:4},mh:{7:6},sj:{6:5,13:15,18:9},sb:{}}; // 지각한 날: 늦은 분

  return `<div class="panel" style="padding:18px"><div class="sec-t">💰 ${mo}월 실근무시간 · 급여 메모 <span class="muted" style="font-weight:500;font-size:12.5px">출퇴근 기록 자동 집계</span></div>
   <table class="alog pay"><tr><th>근무자</th><th>일수</th><th>실근무</th><th>지각</th><th>시급</th><th style="text-align:right">예상 급여</th></tr>
   ${P.map(x=>`<tr><td>${x.w.name}${x.w.removed?' <span class="tag gray">삭제됨</span>':''}${x.working?' <span class="tag" style="background:var(--green-weak);color:var(--green)">근무 중</span>':''}</td><td>${x.days}일</td><td><b>${x.hours}시간</b></td><td>${x.late?`<span class="tag ${x.late>=2?'red':'orange'}" title="${mo}/${x.lateDays.join(', '+mo+'/')}">${x.late}회</span>`:'<span class="muted">-</span>'}</td><td><input class="wage" type="number" step="10" value="${x.wage}" onchange="S.wage['${x.w.id}']=+this.value;markDirty();render()"></td><td style="text-align:right;font-weight:800">${x.pay.toLocaleString()}원</td></tr>`).join('')}
   <tr><td colspan="5" style="font-weight:800">합계</td><td style="text-align:right;font-weight:800;color:var(--brand-ink)">${tot.toLocaleString()}원</td></tr></table>
   <p class="muted" style="font-size:12px;margin:6px 0 10px">실근무 = 퇴근 − 출근 − 휴게(4시간 이상 30분, 8시간 이상 1시간), 한 달 합계를 시간 단위로 계산해요(분 단위 버림). 지각은 예정 출근 시간보다 늦게 찍힌 날이고, 2회 이상이면 빨간색이에요. 주휴수당·세금·4대보험은 빠진 단순 계산이에요. 오늘 근무 중인 사람은 퇴근하면 반영돼요.</p>
   <div class="sec-t" style="margin-bottom:6px">📝 급여 메모</div>
   <textarea rows="2" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);resize:vertical" oninput="S.payMemo=this.value;markDirty(true)">${esc(S.payMemo)}</textarea>
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="downloadPayCSV()">⬇️ 급여 CSV 내려받기</button><span class="muted" style="font-size:12px">엑셀에서 바로 열려요 (일별 기록 + 합계 + 메모)</span></div></div>`;
}
function downloadPayCSV(){
  const R=monthRecords(), P=payroll(), mo=new Date(S.clock).getMonth()+1;
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['[일별 출퇴근 기록]'],['날짜','근무자','파트','예정 출근','출근','퇴근','지각','실근무(시간)']];
  R.sort((a,b)=>a.date.localeCompare(b.date)||a.in.localeCompare(b.in)).forEach(r=>rows.push([r.date,W(r.id).name,W(r.id).shift.split(' ')[0],r.plan,r.in,r.out||'근무 중',r.late?'지각':'',r.net==null?'':+(r.net/60).toFixed(1)]));
  rows.push([]);rows.push(['[근무자별 합계]']);rows.push(['근무자','근무일수','실근무(시간)','지각(회)','시급(원)','예상 급여(원)']);
  P.forEach(x=>rows.push([x.w.name,x.days,x.hours,x.late,x.wage,x.pay]));
  rows.push(['합계','','','','',P.reduce((a,x)=>a+x.pay,0)]);
  rows.push([]);rows.push(['[메모]',S.payMemo]);rows.push(['※ 휴게: 4시간 이상 30분, 8시간 이상 1시간 차감 · 월 합계 시간 단위(분 버림) · 주휴수당/세금/4대보험 미포함']);
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`cafe-ongi_payroll_${new Date(S.clock).getFullYear()}-${String(mo).padStart(2,'0')}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast(`⬇️ ${mo}월 급여 CSV를 내려받았어요`);
}
/* [9단계] 실시간 백업 표시 + 백업 파일 */
let _bk=null;
function markDirty(quiet){S.saving=true;const el=$('#bk');if(el)el.outerHTML=backupChip();clearTimeout(_bk);_bk=setTimeout(()=>{S.saving=false;S.backupAt=S.clock;try{localStorage.setItem('ss-backup',JSON.stringify(snapshot()))}catch(e){}const el2=$('#bk');if(el2)el2.outerHTML=backupChip();const bp=$('#bkp');if(bp)bp.outerHTML=backupPanel()},900)}
function snapshot(){const {modal,afterRender,recTimer,sr,videos,draft,...rest}=S;return {savedAt:new Date().toISOString(),store:'카페 온기 성수점',data:rest}}
function backupChip(){const t=new Date(S.backupAt||S.clock);
  return `<span class="chip bk ${S.saving?'saving':''}" id="bk" title="모든 기록은 바뀔 때마다 서버와 이 기기에 이중으로 저장돼요">${S.saving?'<i class="spin"></i>저장 중…':`<i class="ok"></i>백업 ${t?hhmm(t.getTime())+':'+String(t.getSeconds()).padStart(2,'0'):''}`}</span>`}
function backupPanel(){const t=new Date(S.backupAt||S.clock);
  return `<div class="panel" id="bkp" style="padding:18px"><div class="sec-t">🛡️ 데이터 백업 · 장애 대비</div>
   <div class="bkrow"><span><i class="dot" style="background:var(--green)"></i>클라우드 실시간 저장</span><b>${t?'마지막 '+hhmm(t.getTime())+':'+String(t.getSeconds()).padStart(2,'0'):'대기 중'}</b></div>
   <div class="bkrow"><span><i class="dot" style="background:var(--green)"></i>패드 내부 사본 (오프라인용)</span><b>${t?'동기화됨':'-'}</b></div>
   <div class="bkrow"><span><i class="dot" style="background:var(--blue)"></i>매일 새벽 4시 전체 백업</span><b>보관 30일</b></div>
   <p class="muted" style="font-size:12.5px;margin:8px 0 10px">서버가 멈춰도 패드에 저장된 사본으로 인수인계·매뉴얼을 계속 볼 수 있고, 복구되면 그동안 남긴 기록이 자동으로 올라가요.</p>
   <button class="btn" onclick="downloadBackup()">⬇️ 지금 백업 파일 내려받기</button></div>`}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}));a.download=`slidingshift_backup_${hhmm(S.clock).replace(':','')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('🛡️ 백업 파일을 내려받았어요')}
function draftManual(fid){
  const f=S.faqs.find(x=>x.id===fid), d=FAQ_DRAFT[fid];
  S.modal=()=>`<div class="scrim" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal"><span class="ai-tag">AI가 쓴 매뉴얼 초안</span> ${catBadge(d.cat)}<h2 class="h1" style="margin:10px 0 2px">${esc(d.title)}</h2><p class="muted" style="margin:0 0 12px">근무자 질문 “${esc(f.q)}” ${f.n}회에서 생성 · 「${CATS[d.cat].l}」 분류로 들어가요</p>
   <p style="margin:0 0 10px">${esc(d.purpose)}</p><div style="font-weight:700;margin-bottom:6px">📍 ${esc(d.locText)}</div>
   <ol class="steps">${d.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol>
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="S.modal=null;render()">나중에</button><button class="btn primary lg" onclick="approve('${fid}')">✔ 승인하고 매뉴얼에 추가</button></div></div></div>`;
  render();
}
function approve(fid){const f=S.faqs.find(x=>x.id===fid),d=FAQ_DRAFT[fid];f.approved=true;S.manuals[d.key]={...d,views:0,isNew:true};S.modal=null;render();toast(`📘 「${d.title}」 매뉴얼이 ${CATS[d.cat].l}에 등록됐어요`)}

/* ---- [테스트] 퇴근 = 교대 마감 / 자동 승계 ---- */
function endShift(){
  const me=W(S.worker), nxt=nextOf(me);
  const others=onDuty().filter(w=>w.id!==me.id);
  const open=S.cards.filter(c=>c.status<4), mine=S.cards.filter(c=>c.shift===S.shiftNo&&c.from===me.name), done=S.cards.filter(c=>c.status===4);
  const pick=onDuty().length>1?`<div class="row" style="gap:6px;margin:0 0 12px"><span class="muted" style="font-size:12.5px;font-weight:700">누가 퇴근하나요?</span>${onDuty().map(w=>`<button class="duty ${w.id===me.id?'on':''}" onclick="S.worker='${w.id}';endShift()">${av(w)}${w.name}</button>`).join('')}</div>`:'';
  S.modal=()=>`<div class="scrim"><div class="modal">${pick}<h2 class="h1" style="margin:0">${me.name}님, 수고하셨어요 👋</h2><p class="muted" style="margin:4px 0 0">${me.shift} · ${S.att[me.id]?S.att[me.id].in+' 출근 → ':''}${now()} 퇴근으로 기록할게요.</p>
   <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin:16px 0 4px"><div class="panel kpi"><small>내가 남긴 카드</small><div class="v">${mine.length}</div></div><div class="panel kpi"><small>완료</small><div class="v" style="color:var(--green)">${done.length}</div></div><div class="panel kpi"><small>다음 교대로 승계</small><div class="v" style="color:var(--orange)">${open.length}</div></div></div>
   <div class="sec-t" style="margin-top:14px">🔁 ${nxt.name}님(${nxt.shift.split(' ')[0]})에게 넘어가는 카드</div>
   ${others.length?`<p class="muted" style="margin:-4px 0 6px;font-size:13px">함께 근무 중인 ${others.map(w=>w.name).join(', ')}님도 계속 볼 수 있어요.</p>`:''}
   <div class="hand" id="hand">${open.map(c=>`<div class="it">${TYPES[c.type].ic} <b style="flex:1">${esc(c.title)}</b>${stBadge(c.status)}${c.shift===S.shiftNo?'<span class="tag brand">새 카드</span>':`<span class="tag orange">이월 ${c.carry+1}회차</span>`}</div>`).join('')}</div>
   <div class="row" style="justify-content:flex-end"><button class="btn" onclick="S.modal=null;render()">계속 근무</button><button class="btn primary lg" onclick="doHandover('${nxt.id}')">퇴근하고 넘기기 ➜</button></div></div></div>`;
  render();
}
function doHandover(nid){
  document.querySelectorAll('#hand .it').forEach((e,i)=>{e.style.animationDelay=(i*.12)+'s';e.classList.add('go')});
  setTimeout(()=>{
    const meW=W(S.worker), me=meW.name;let n=0;
    if(S.clock<new Date(2026,10,19,13,0,0).getTime())S.clock=new Date(2026,10,19,13,1,10).getTime();
    S.cards.forEach(c=>{c.fresh=false;if(c.status<4){if(c.shift!==S.shiftNo)c.carry++;n++;if(c.status===1)c.status=0}});
    if(S.att[meW.id])S.att[meW.id].out=now();S.attLog.push({id:meW.id,kind:'out',t:now()});
    sysMsg(`${me}님이 퇴근했어요 · 미해결 ${n}건이 ${W(nid).name}님에게 넘어가요`);
    notify('🔁 퇴근 · 교대',`${me} → ${W(nid).name} · 미해결 ${n}건 자동 승계`);
    S.shiftNo++;S.bannerCarry=n;S.modal=null;S.worker=null;S.nextWorker=(S.att[nid]&&!S.att[nid].out)?null:nid;S.view='attend';
    render();
  },900);
}

/* ---- 점주 폰 (실시간 동기화 미리보기) ---- */
function renderPhone(){
  const el=$('#phone');if(!el)return;
  el.innerHTML=`<div class="lbl"><span class="live"></span> 점주 휴대폰 · 실시간 동기화</div><div class="phone"><div class="notch"></div>
  ${S.phonePush?`<div class="banner-push"><b>슬라이딩시프트 · 지금</b>${esc(S.phonePush.title)}<br>${esc(S.phonePush.text)}</div>`:''}
  <div class="ph-top"><b>👑 ${OWNER}</b><div class="muted" style="font-size:11.5px">카페 온기 성수점 · 근무 중 ${onDuty().length}명 · 미해결 ${openCount()}건</div>
  <div class="tabs"><button class="${S.phoneTab==='noti'?'on':''}" onclick="S.phoneTab='noti';renderPhone()">알림 ${S.notis.filter(n=>n.fresh).length?'•':''}</button><button class="${S.phoneTab==='chat'?'on':''}" onclick="S.phoneTab='chat';renderPhone()">단체방</button></div></div>
  ${S.phoneTab==='noti'?`<div class="body">${S.notis.map(n=>`<div class="noti ${n.fresh?'new':''}"><b>${esc(n.title)}</b>${esc(n.text)}<br><small>${esc(n.t)}</small></div>`).join('')}</div>`:
   `<div class="body" style="padding:0"><div style="padding:8px 12px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)">💬 카페 온기 성수점 단체방 · ${active().length+1}명</div><div class="msgs" id="pmsgs">${S.room.map(m=>bubble(m,true)).join('')}${S.phoneTyping?'<div class="msg me typing"><div class="bub" style="background:var(--brand)"><i style="background:#fff"></i><i style="background:#fff"></i><i style="background:#fff"></i></div></div>':''}</div></div>
   <form class="send" onsubmit="event.preventDefault();ownerSend(this.m.value,null)"><input name="m" placeholder="단체방에 답장…" autocomplete="off"><button class="btn primary" style="padding:8px 12px">↑</button></form>`}
  </div>`;
  S.notis.forEach(n=>{if(n.fresh)setTimeout(()=>{n.fresh=false},1500)});
  const pm=$('#pmsgs');if(pm)pm.scrollTop=pm.scrollHeight;
}
function togglePhone(){S.phone=!S.phone;render()}

/* ---- 네비게이션 ---- */
function go(v){if(v==='admin'&&!S.ownerAuth){askPin();return}if(v!=='admin')S.ownerAuth=false;if(v!=='rec-voice'){clearInterval(S.recTimer);stopSR()}S.view=v;if(v==='chat')S.afterRender=scrollMsgs;render();const c=$('#content');if(c&&v!=='chat')c.scrollTop=0}
function resetDemo(){clearInterval(S.recTimer);WORKERS=JSON.parse(JSON.stringify(WORKERS0));S=seed();render();toast('데모를 처음 상태로 되돌렸어요')}
// 메시지 보내면 폰은 자동으로 단체방 탭으로
const _notify=notify;notify=function(t,x){_notify(t,x);if(/💬/.test(t)){S.phoneTab='chat';renderPhone()}};

/* 시연 순서 도우미 (? 키) */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(S.pinOpen){if(/^[0-9]$/.test(e.key)){pinKey(e.key);return}if(e.key==='Backspace'){pinKey('del');return}if(e.key==='Escape'){closePin();return}}
  if(e.key==='?'){S.modal=S.modal?null:()=>`<div class="scrim" onclick="S.modal=null;render()"><div class="modal"><h2 class="h1">시연 순서</h2><ol style="line-height:2;padding-left:20px;margin:10px 0 0">
   <li><b>출퇴근 화면</b>: 김지윤·정하늘 2명 근무 중 → <b>김지윤 「이 사람으로 사용」</b></li><li>홈 → <b>🎙️ 음성으로 기록</b> (바로 실시간 음성 인식, 안 되면 기본 시나리오) → AI 정리 → 추가 질문 「오늘 중」 → 단체방에 카드 올라감</li>
   <li>단체방에 「오트밀크 3팩 남음 내일까지 발주」 입력 → AI 제안 → 카드로 만들기</li>
   <li><b>퇴근 · 교대 마감</b> → 미해결 카드 승계 → 출퇴근 화면에서 <b>이민호 출근</b></li><li>단체 주문 카드 → <b>관련 레시피</b> (아메리카노·라떼) / 우유 카드 → 매뉴얼 → 완료</li><li>누수 카드 → 메시지 → 단체방·점주 폰에서 답장</li><li><b>업무 매뉴얼</b> 카테고리 탭 · 레시피 HOT/ICE · <b>점주 대시보드</b> 승인</li></ol>
   <p class="muted" style="font-size:13px;margin-top:14px">단축키: <span class="kbd">?</span> 이 창 · 왼쪽 아래 「데모 처음부터」로 초기화</p></div></div>`;
   render()}
});
render();
</script>
