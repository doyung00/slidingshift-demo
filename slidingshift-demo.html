<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라이딩시프트 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#F8F9FC; --ink:#161A26; --ink2:#3A4152; --muted:#6B7385; --line:#E4E7EE;
  --brand:#5146E5; --brand-weak:#ECEBFF; --brand-ink:#3A30C2;
  --red:#E5484D; --red-weak:#FDECEC; --orange:#F2711C; --orange-weak:#FFF1E7;
  --amber:#D99A00; --amber-weak:#FFF6DB; --green:#12A150; --green-weak:#E5F7EC;
  --blue:#2F6FEB; --blue-weak:#E8F0FE; --violet:#7C3AED; --violet-weak:#F2EBFF; --gray-weak:#EEF0F4;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 4px 16px rgba(20,24,40,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1117; --surface:#181B24; --surface2:#1E222D; --ink:#EEF0F6; --ink2:#C9CEDB; --muted:#8C93A6; --line:#2A2F3C;
    --brand:#7B72FF; --brand-weak:#26244A; --brand-ink:#B3ADFF;
    --red-weak:#3A1D20; --orange-weak:#3A2616; --amber-weak:#3A3014; --green-weak:#15301F; --blue-weak:#172946; --violet-weak:#2A1E45; --gray-weak:#252A36;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1117; --surface:#181B24; --surface2:#1E222D; --ink:#EEF0F6; --ink2:#C9CEDB; --muted:#8C93A6; --line:#2A2F3C;
  --brand:#7B72FF; --brand-weak:#26244A; --brand-ink:#B3ADFF;
  --red-weak:#3A1D20; --orange-weak:#3A2616; --amber-weak:#3A3014; --green-weak:#15301F; --blue-weak:#172946; --violet-weak:#2A1E45; --gray-weak:#252A36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.app.with-phone{grid-template-columns:232px 1fr 360px}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#9B5CF6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.logo b{font-size:16px;display:block;line-height:1.2}
.logo small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);font-weight:500;width:100%;text-align:left;position:relative}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--brand-weak);color:var(--brand-ink);font-weight:700}
.nav .ic{width:22px;text-align:center;font-size:17px}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
.side .foot button{color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--surface);border-bottom:1px solid var(--line)}
.store{font-weight:700}
.store small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.top .grow{flex:1}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{filter:brightness(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.content{flex:1;overflow:auto;padding:24px 26px 40px}
.h1{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.sec-t{font-weight:800;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
/* banner */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--orange-weak);color:var(--ink);margin-bottom:16px;font-weight:500}
.banner.info{background:var(--brand-weak)}
.banner .x{margin-left:auto}
/* cards */
.filters{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.fbtn{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.fbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hcard{padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden}
.hcard:hover{transform:translateY(-2px)}
.hcard.urgent{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.hcard.urgent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.hcard.done{opacity:.62}
.hcard.newin{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.94);box-shadow:0 0 0 6px var(--brand-weak)}100%{transform:none}}
.tline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.type{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.red{background:var(--red-weak);color:var(--red)}
.tag.orange{background:var(--orange-weak);color:var(--orange)}
.tag.gray{background:var(--gray-weak);color:var(--muted)}
.tag.brand{background:var(--brand-weak);color:var(--brand-ink)}
.hcard .title{font-weight:800;font-size:16.5px;line-height:1.35}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0;color:var(--ink2);font-weight:500}
.hcard .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-0{background:var(--gray-weak);color:var(--muted)} .st-1{background:var(--blue-weak);color:var(--blue)} .st-2{background:var(--violet-weak);color:var(--violet)} .st-3{background:var(--amber-weak);color:var(--amber)} .st-4{background:var(--green-weak);color:var(--green)}
/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);transition:all .2s}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gray-weak);font-size:12px}
.step.past{color:var(--ink2)} .step.past .n{background:var(--brand);color:#fff}
.step.cur{border-color:var(--brand);background:var(--brand-weak);color:var(--brand-ink)} .step.cur .n{background:var(--brand);color:#fff}
.step:hover{border-color:var(--brand)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.field .v{font-weight:700;font-size:14.5px}
.field input,.field select{width:100%;border:0;background:transparent;font-weight:700;font-size:14.5px;padding:0;outline:none}
.field.miss{border:1.5px dashed var(--orange);background:var(--orange-weak)}
.field.wide{grid-column:1/-1}
.origin{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.origin .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-weak);display:grid;place-items:center;font-size:19px;flex:none}
.quote{font-size:14px;color:var(--ink2)}
.audio{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.audio .bars{display:flex;gap:2px;align-items:center;height:16px}
.audio .bars i{width:3px;background:var(--brand);border-radius:2px;opacity:.6}
/* manual */
.mlink{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--brand-weak),var(--surface));border:1px solid var(--line);width:100%;text-align:left}
.mlink .ic{font-size:24px}
.mlink b{display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mcard{padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.steps li .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800;font-size:13px}
.steps li.ok{background:var(--green-weak);border-color:transparent}
.steps li.ok .n{background:var(--green)}
.steps li.ok span{text-decoration:line-through;color:var(--muted)}
.warn{background:var(--red-weak);border-radius:12px;padding:12px 14px;font-size:14px}
.warn li{margin:2px 0}
.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.terms dt{font-weight:800;color:var(--brand-ink)} .terms dd{margin:0;color:var(--ink2)}
.plan{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.plan .z{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.plan .z.hl{fill:var(--brand-weak);stroke:var(--brand);stroke-width:2.5}
.plan text{font-size:11px;fill:var(--muted);font-family:inherit;font-weight:500}
.plan text.hl{fill:var(--brand-ink);font-weight:800}
.plan .pulse{fill:var(--brand);transform-origin:center;transform-box:fill-box;animation:pl 1.4s infinite}
@keyframes pl{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.video{aspect-ratio:16/9;border-radius:12px;background:#1d2030;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.video .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
.video small{position:absolute;left:12px;bottom:10px;opacity:.8}
/* chat */
.chat{display:flex;flex-direction:column;height:100%;min-height:340px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:12px;border:1px solid var(--line);min-height:220px;max-height:420px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11.5px;color:var(--muted)}
.msg .bub{padding:9px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--brand);color:#fff;border-color:var(--brand)}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .bub{background:transparent;border:0;color:var(--muted);font-size:12px;padding:2px}
.msg.new{animation:pop .5s ease}
.typing .bub{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
.send{display:flex;gap:8px;margin-top:10px}
.send input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);outline:none}
.send input:focus{border-color:var(--brand)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.pin{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--amber-weak);margin-bottom:12px;font-size:14px}
.threads{display:flex;flex-direction:column;gap:6px}
.thr{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent}
.thr:hover{background:var(--surface2)}
.thr.on{background:var(--brand-weak);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.thr .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* record */
.recbig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.rb{padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-radius:20px}
.rb .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:36px}
.rb b{font-size:19px}
.rb small{color:var(--muted)}
.rb:hover{border-color:var(--brand)}
.recwrap{max-width:760px;margin:0 auto;text-align:center;padding:30px}
.mic{width:130px;height:130px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:16px auto;color:#fff;font-size:50px;position:relative}
.mic::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--red);opacity:.4;animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:52px;margin:6px 0 14px}
.wave i{width:5px;border-radius:3px;background:var(--brand);animation:wv 0.9s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:46px}}
.transcript{min-height:84px;font-size:19px;font-weight:500;line-height:1.6;padding:16px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.transcript .cur{display:inline-block;width:2px;height:20px;background:var(--brand);vertical-align:middle;animation:tp .8s infinite}
.ai-steps{list-style:none;padding:0;margin:20px auto;max-width:420px;text-align:left;display:flex;flex-direction:column;gap:10px}
.ai-steps li{display:flex;gap:12px;align-items:center;font-size:16px;color:var(--muted);transition:color .2s}
.ai-steps li .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.ai-steps li.run{color:var(--ink)} .ai-steps li.run .d{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.ai-steps li.ok{color:var(--ink)} .ai-steps li.ok .d{background:var(--green);border-color:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ph{border-radius:14px;overflow:hidden;border:2px solid var(--line);text-align:left;background:var(--surface)}
.ph:hover{border-color:var(--brand)}
.ph svg{display:block;width:100%;height:auto}
.ph div{padding:8px 10px;font-size:13px;font-weight:500}
textarea.big{width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;background:var(--surface);outline:none;resize:vertical}
textarea.big:focus{border-color:var(--brand)}
.ask{border-radius:14px;padding:14px 16px;background:var(--orange-weak);border:1.5px solid color-mix(in srgb,var(--orange) 40%,transparent)}
.ask b{display:flex;gap:8px;align-items:center}
.ask .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ask .opts button{padding:8px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.ask .opts button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.ai-tag{font-size:11.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-weak);padding:2px 8px;border-radius:99px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,var(--brand-weak),transparent),var(--bg)}
.lbox{width:min(880px,100%);padding:34px}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 10px}
.wbtn{padding:22px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.wbtn:hover{border-color:var(--brand)}
.wbtn.next{border-color:var(--brand);box-shadow:0 0 0 5px var(--brand-weak)}
.wbtn .av{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff}
.wbtn b{font-size:18px}
.wbtn small{color:var(--muted)}
.wbtn .nb{position:absolute;top:10px;right:10px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;padding:26px;border-radius:20px;background:var(--surface)}
.hand{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.hand .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.hand .it.go{animation:slide .7s ease both}
@keyframes slide{0%{transform:translateX(0);opacity:1}60%{transform:translateX(24px);opacity:.3}100%{transform:none;opacity:1}}
/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:500;font-size:14px;box-shadow:var(--shadow);animation:up .3s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{padding:16px}
.kpi small{color:var(--muted);font-weight:500;font-size:12.5px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .d{font-size:12.5px;font-weight:700}
.up{color:var(--green)} .dn{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.col{background:var(--surface2);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;font-weight:500;margin-bottom:6px}
.faq{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
.faq .q{font-weight:700}
.faq .c{font-size:12.5px;color:var(--muted)}

.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:10px 6px 0}

.bars .b i{width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:var(--brand);display:block}
.bars .b.before i{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.bars .b em{font-style:normal;font-weight:800;color:var(--ink);font-size:13px}

.phone-wrap{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 14px;height:100vh;overflow:hidden}

.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:lv 1.6s infinite}
@keyframes lv{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}100%{box-shadow:0 0 0 8px rgba(18,161,80,0)}}
.phone{width:320px;flex:1;max-height:700px;border-radius:40px;border:10px solid #111;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone .notch{width:110px;height:24px;background:#111;border-radius:0 0 14px 14px;margin:0 auto}
.phone .ph-top{padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.phone .ph-top b{font-size:15px}
.phone .tabs{display:flex;gap:6px;margin-top:8px}
.phone .tabs button{flex:1;padding:6px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--surface2)}
.phone .tabs button.on{background:var(--ink);color:var(--surface)}
.phone .body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.noti{padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:13px}
.noti b{display:block;font-size:13px}
.noti small{color:var(--muted);font-size:11px}
.noti.new{animation:pop .6s ease;border-color:var(--brand)}
.phone .msgs{max-height:none;min-height:0;border:0;padding:6px;background:transparent}
.phone .send{padding:8px;margin:0;border-top:1px solid var(--line)}
.phone .send input{padding:9px 12px;font-size:13px}
.phone .msg .bub{font-size:13px}
.banner-push{position:absolute;left:8px;right:8px;top:30px;background:rgba(30,32,44,.94);color:#fff;border-radius:16px;padding:10px 12px;font-size:12.5px;z-index:5;animation:drop .4s ease}
.banner-push b{display:block;font-size:12px;opacity:.8}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.help{position:fixed;right:14px;bottom:14px;z-index:40}
.kbd{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface2)}
/* responsive */
@media (max-width:1100px){.app.with-phone{grid-template-columns:200px 1fr 340px}.side{padding:16px 8px}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}

}

  if(/발주|재고|떨어|남았|부족|채워|모자/.test(t))type='재고·발주';
  if(/예약|단체|픽업/.test(t))type='주문·예약';
  if(/청소|위생|쓰레기|닦|소독/.test(t))type='청소·위생';
  if(/고장|새요|새고|샌다|누수|안 ?돼|안 ?나와|에러|경고|이상한 소리|멈췄|작동/.test(t))type='장비 이상';
  const qm=t.match(/(\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*(팩|개|박스|잔|봉지|봉|통|병|롤|장|kg|L|리터)/);
  const qty=qm?((KNUM[qm[1]]||qm[1])+qm[2]):'';
  const LOCS=['워크인 냉장고','냉장고','냉동고','창고','카운터','포스','에스프레소 머신','그라인더','제빙기','스팀 노즐','그룹','화장실','홀','테라스','오븐','쇼케이스','선반'];
  const loc=(LOCS.find(l=>t.includes(l))||'');
  const dm=t.match(/(오늘|내일|모레|이번 ?주|주말|[월화수목금토일]요일)?\s*(오전|오후)?\s*(\d{1,2}|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|열한|열두)\s*시\s*(반)?\s*(전|까지)?/);
  let due='';
  if(dm&&dm[0].trim().length>1){due=dm[0].trim().replace(/(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)(?=\s*시)/,m=>({'한':1,'두':2,'세':3,'네':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10,'열한':11,'열두':12}[m]))}
  else{const d2=t.match(/오늘|내일|모레|이번 ?주|주말/);if(d2)due=d2[0]}
  let first=t.split(/[.!?。\n]/)[0].trim(); if(first.length>26)first=first.slice(0,25)+'…';
  const nextMap={'재고·발주':'수량 확인 후 발주','장비 이상':'사용 중지 표시 후 사장님께 알리기','주문·예약':'예약 내용 확인 · 준비물 체크','청소·위생':'청소 후 완료 체크','기타':'내용 확인 후 처리'};
  const manMap={'재고·발주':'m-milk','장비 이상':'m-espresso','주문·예약':'m-group','청소·위생':'m-grinder','기타':null};
  return {type,title:first||'새 인수인계',qty:qty||'-',loc,next:nextMap[type],due,urgent:/급|빨리|당장|지금/.test(t),manual:manMap[type],
    ask:!due?{q:'언제까지 처리해야 하나요?',opts:['오늘 중','다음 교대 시작 전','이번 주 안','급하지 않음']}:(!loc?{q:'어디에서 생긴 일인가요?',opts:['카운터·포스','에스프레소 머신','워크인 냉장고','창고'],field:'loc'}:null)};
}

function chatBox(th,compact){
  const L=S.chats[th]||[];
  const me=!compact;
  const q=th==='notice'?['확인했습니다!','원두 2kg 남았어요']:['사진 보내드릴게요','확인했어요','지금 처리 중이에요','도움이 필요해요'];
  return `<div class="chat"><div class="msgs" id="msgs-${th}">${L.length?L.map(m=>bubble(m,false)).join(''):'<div class="msg sys"><div class="bub">아직 대화가 없어요. 급한 일은 여기서 바로 사장님께 보내세요.</div></div>'}${S.typing===th?'<div class="msg typing"><span class="who">'+OWNER+'</span><div class="bub"><i></i><i></i><i></i></div></div>':''}</div>
  <div class="quick">${q.map(x=>`<button onclick="sendW('${th}','${x}')">${x}</button>`).join('')}</div>
  <form class="send" onsubmit="event.preventDefault();sendW('${th}',this.m.value);"><input name="m" placeholder="사장님께 메시지 보내기…" autocomplete="off"><button class="btn primary">보내기</button></form></div>`;

function bubble(m,ownerView){
  if(m.from==='sys')return `<div class="msg sys ${m.fresh?'new':''}"><div class="bub">${esc(m.text)}</div></div>`;
  const mine=ownerView?m.from==='owner':m.from!=='owner';
  return `<div class="msg ${mine?'me':''} ${m.fresh?'new':''}"><span class="who">${m.from==='owner'?'👑 '+OWNER:esc(m.who)} · ${esc(m.t)}</span><div class="bub">${esc(m.text)}</div></div>`;
}
function scrollMsgs(){document.querySelectorAll('.msgs').forEach(e=>e.scrollTop=e.scrollHeight)}
function sysMsg(th,text){(S.chats[th]=S.chats[th]||[]).push({from:'sys',text,t:now()})}
function sendW(th,text){
  text=(text||'').trim();if(!text)return;
  const me=W(S.worker).name;
  (S.chats[th]=S.chats[th]||[]).forEach(m=>m.fresh=false);
  S.chats[th].push({from:'w',who:me,text,t:now(),fresh:true});
  const c=card(th);
  notify(`💬 ${me}${c?' · '+c.title:' · 공지'}`,text);
  S.phoneThread=th;
  S.afterRender=scrollMsgs;render();
  // 점주 자동 응답 (데모 시나리오)
  if(S.autoReplied&&S.autoReplied[th])return;
  S.autoReplied=S.autoReplied||{};S.autoReplied[th]=true;
  let reply='확인했어요, 고마워요 👍';
  if(c&&c.manual==='m-espresso')reply='헉 고마워요! 수리 기사님 오늘 4시에 오시기로 했어요. 그때까지 2번 그룹은 쓰지 말아 주세요 🙏';
  else if(c&&c.type==='재고·발주')reply='고마워요! 주말 전이니까 16팩으로 넣어 주세요.';
  else if(th==='notice')reply='좋아요 👍 다들 고마워요!';
  setTimeout(()=>{S.typing=th;S.phoneTyping=true;S.afterRender=scrollMsgs;render()},1400);
  setTimeout(()=>{S.typing=null;S.phoneTyping=false;ownerSend(th,reply)},3600);
}
function ownerSend(th,text){
  text=(text||'').trim();if(!text)return;
  (S.chats[th]=S.chats[th]||[]).forEach(m=>m.fresh=false);
  S.chats[th].push({from:'owner',text,t:now(),fresh:true});
  if(S.view!=='card'||S.sel!==th)toast(`👑 사장님: ${text.slice(0,30)}${text.length>30?'…':''}`);
  S.afterRender=scrollMsgs;render();
}
function viewChat(){
  const ths=['notice',...S.cards.filter(c=>(S.chats[c.id]||[]).length||c.status<4).map(c=>c.id)];
  const cur=S.chatThread||'notice';
  const name=th=>th==='notice'?'📌 매장 공지':(TYPES[card(th).type].ic+' '+card(th).title);
  const last=th=>{const L=S.chats[th]||[];return L.length?L[L.length-1].text:'대화 없음'};
  return `<h1 class="h1">실시간 소통</h1><p class="sub">카드별로 사장님과 대화해요. 근무 중 개인 폰을 못 봐도 공용 패드에서 바로 확인할 수 있어요.</p>
  <div class="grid2" style="grid-template-columns:320px 1fr"><div class="panel" style="padding:10px"><div class="threads">${ths.map(th=>`<button class="thr ${th===cur?'on':''}" onclick="S.chatThread='${th}';render();scrollMsgs()"><div style="min-width:0"><div class="t">${esc(name(th))}</div><div class="p">${esc(last(th))}</div></div></button>`).join('')}</div></div>
  <div class="panel" style="padding:16px">${cur==='notice'?`<div class="pin">📌 <div><b>고정 공지</b> · ${esc(S.notice)}</div></div>`:`<div class="row" style="margin-bottom:10px">${typeBadge(card(cur).type)}<b>${esc(card(cur).title)}</b><span style="margin-left:auto">${stBadge(card(cur).status)}</span><button class="btn" onclick="openCard('${cur}')">카드 보기</button></div>`}${chatBox(cur)}</div></div>`;
}

function startVoice(){S.rec={text:'',done:false,live:false};S.view='rec-voice';render();
  let i=0;clearInterval(S.recTimer);
  S.recTimer=setInterval(()=>{ if(S.view!=='rec-voice'){clearInterval(S.recTimer);return}
    i+=2;S.rec.text=SCRIPT_VOICE.slice(0,i);
    const el=$('#tr');if(el)el.innerHTML=esc(S.rec.text)+'<span class="cur"></span>';
    const sec=$('#rsec');if(sec)sec.textContent='0:'+String(Math.min(12,Math.floor(i/6))).padStart(2,'0');
    if(i>=SCRIPT_VOICE.length){clearInterval(S.recTimer);S.rec.done=true;const b=$('#stopb');if(b){b.classList.add('primary');b.textContent='■ 녹음 끝내고 AI로 정리하기'}}
  },70);
}
function startLiveVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('이 브라우저는 음성 인식을 지원하지 않아요 (Chrome 권장)');return}
  clearInterval(S.recTimer);S.rec={text:'',done:false,live:true};render();
  const r=new SR();r.lang='ko-KR';r.interimResults=true;r.continuous=true;S.sr=r;
  r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;S.rec.text=t;const el=$('#tr');if(el)el.innerHTML=esc(t)+'<span class="cur"></span>'};
  r.onerror=()=>toast('마이크 권한을 확인해 주세요');
  r.start();
}
function viewVoice(){
  const live=S.rec&&S.rec.live;
  return `<div class="recwrap"><h1 class="h1">듣고 있어요…</h1><p class="sub">편하게 말하세요. 수량·위치·기한은 AI가 찾아내요.</p>
  <div class="mic">🎙️</div><div class="wave">${Array.from({length:22},(_,i)=>`<i style="animation-delay:${(i%7)*.11}s"></i>`).join('')}</div>
  <div class="muted" style="margin-bottom:8px">● 녹음 중 <b id="rsec">0:00</b> ${live?'· 실제 마이크':''}</div>
  <div class="transcript" id="tr">${esc(S.rec.text)}<span class="cur"></span></div>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" onclick="go('record')">취소</button><button id="stopb" class="btn lg ${S.rec.done||live?'primary':''}" onclick="stopVoice()">${S.rec.done||live?'■ 녹음 끝내고 AI로 정리하기':'■ 녹음 끝내기'}</button></div>
  ${live?'':`<p style="margin-top:18px"><button class="muted" style="text-decoration:underline;font-size:13px" onclick="startLiveVoice()">실제 마이크로 말해 보기 (Chrome)</button></p>`}</div>`;
}
function stopVoice(){
  clearInterval(S.recTimer);if(S.sr){try{S.sr.stop()}catch(e){}S.sr=null}
  const live=S.rec.live, text=live?S.rec.text:SCRIPT_VOICE;
  if(!text.trim()){toast('녹음된 내용이 없어요');return}
  runAI({kind:'voice',text,dur:'0:12'},analyze(text,live?null:PRESET_VOICE),['음성 → 텍스트 변환 (STT)','문제 유형 분류','수량 · 위치 · 기한 추출','빠진 정보 확인','관련 업무 매뉴얼 연결']);
}
function viewPhoto(){

function pickPhoto(k){const p=PRESET_PHOTO[k];runAI({kind:'photo',photo:k,text:p.title,vision:p.vision},analyze('',p),['사진 업로드','이미지 속 물품·장비 인식','문제 유형 분류','빠진 정보 확인','관련 업무 매뉴얼 연결'])}

function viewText(){

function submitText(){const t=$('#tx').value.trim();if(!t){toast('내용을 입력해 주세요');return}
  runAI({kind:'text',text:t},analyze(t),['문장 이해','문제 유형 분류','수량 · 위치 · 기한 추출','빠진 정보 확인','관련 업무 매뉴얼 연결'])}
function runAI(src,result,steps){
  S.draft={src,...result,answer:null};S.aiSteps=steps;S.aiIdx=0;S.view='rec-ai';render();
  const tick=()=>{S.aiIdx++;if(S.view!=='rec-ai')return;if(S.aiIdx>steps.length){S.view='review';render();return}const el=$('#content');if(el)el.innerHTML=viewAI();setTimeout(tick,520)};
  setTimeout(tick,520);
}
function viewAI(){
  return `<div class="recwrap"><div style="font-size:46px">✨</div><h1 class="h1">AI가 인수인계 카드로 정리하고 있어요</h1><p class="sub">원본 기록은 그대로 함께 저장돼요.</p>
  <ul class="ai-steps">${S.aiSteps.map((s,i)=>`<li class="${i<S.aiIdx?'ok':i===S.aiIdx?'run':''}"><span class="d">${i<S.aiIdx?'✓':''}</span>${s}</li>`).join('')}</ul></div>`;
}

   <div class="fields">${fld('qty','수량')}${fld('due','기한')}${fld('loc','위치')}${fld('next','다음 행동')}</div>
   ${d.ask?`<div class="ask"><b>🤖 하나만 더 알려 주세요 — ${esc(d.ask.q)}</b><div class="opts">${d.ask.opts.map(o=>`<button class="${d.answer===o?'on':''}" onclick="answer('${o}')">${o}</button>`).join('')}</div></div>`:''}
   <div class="row"><button class="btn primary lg" ${d.ask&&!d.answer?'disabled':''} onclick="commitDraft()">✔ 확인 · 다음 교대로 넘기기</button><button class="btn" onclick="go('record')">다시 기록</button></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:14px"><div class="panel" style="padding:16px"><div class="sec-t">원본 기록 <span class="muted" style="font-weight:500;font-size:13px">AI가 틀려도 원본이 함께 전달돼요</span></div>${origin({src:d.src})}</div>
   ${m?`<div class="mlink panel"><span class="ic">📘</span><span><span class="muted" style="font-size:12.5px">자동 연결된 매뉴얼</span><b>${esc(m.title)}</b><span class="muted" style="font-size:12.5px">다음 근무자가 카드에서 바로 열 수 있어요</span></span></div>`:`<div class="panel" style="padding:16px"><span class="muted">연결할 매뉴얼이 아직 없어요. 반복되면 점주가 매뉴얼로 승인할 수 있어요.</span></div>`}
  </section></div>`;

function answer(o){const d=S.draft;d.answer=o;const f=(d.ask.field||'due');d[f]=o.replace(/ \(.*\)/,'');if(/오늘|지금|14시/.test(o))d.urgent=true;if(f==='qty'&&/없음/.test(o)){d.next='사장님께 용지 주문 요청';d.urgent=true}render()}
function commitDraft(){
  const d=S.draft,me=W(S.worker).name;
  const id='n'+Date.now();
  S.cards.unshift({id,type:d.type,title:d.title,qty:d.qty||'-',loc:d.loc,next:d.next,due:d.due,urgent:d.urgent,status:0,from:me,at:'오늘 '+now(),src:d.src,manual:d.manual,carry:0,assignee:null,shift:S.shiftNo,fresh:true});
  notify(d.urgent?'🚨 긴급 인수인계 카드':'📦 새 인수인계 카드',`${d.title} (${me})`);
  S.draft=null;S.view='home';S.filter='all';render();toast('🗂️ 카드가 등록됐어요 · 사장님 폰에도 알림이 갔어요');
}

   <div class="panel kpi"><small>카드 확인까지 평균</small><div class="v">4분</div><div class="d up">▼ 단톡방 대비 -78%</div></div>
   <div class="panel kpi"><small>반복 질문 (이번 달)</small><div class="v">${14-S.faqs.filter(f=>f.approved).reduce((a,f)=>a+f.n,0)}건</div><div class="d up">▼ 지난달 대비 -42%</div></div></div>
  <div class="grid2"><section class="panel" style="padding:18px"><div class="sec-t">🙋 자주 나오는 질문 → 매뉴얼로 승인</div><p class="muted" style="margin:-4px 0 12px;font-size:13px">근무자들이 반복해서 물어본 질문을 AI가 모았어요. 승인하면 AI가 쓴 초안이 매장 매뉴얼이 돼요.</p>
   ${S.faqs.map(f=>`<div class="faq"><div><div class="q">“${esc(f.q)}”</div><div class="c">${f.n}회 질문 · 근무자 ${f.who}명</div></div>${f.approved?'<span class="st st-4" style="margin-left:auto"><i></i>매뉴얼 등록됨</span>':`<button class="btn primary" onclick="draftManual('${f.id}')">✨ 매뉴얼 초안 보기</button>`}</div>`).join('')}
   <div class="sec-t" style="margin-top:18px">📌 공지 고정</div><form class="send" style="margin:0" onsubmit="event.preventDefault();S.notice=this.n.value;notify('📌 공지 변경',S.notice);toast('공용 패드 맨 위에 고정됐어요');render()"><input name="n" value="${esc(S.notice)}"><button class="btn">고정</button></form></section><section class="panel" style="padding:18px"><div class="sec-t">📉 인수인계 누락 건수 (파일럿 가정치)</div>
   <div class="bars">${[['도입 전 1주',9,1],['도입 전 2주',11,1],['도입 1주',5,0],['도입 2주',3,0],['도입 3주',2,0],['도입 4주',1,0]].map(([l,v,b])=>`<div class="b ${b?'before':''}"><em>${v}</em><i style="height:${v*8}px"></i>${l}</div>`).join('')}</div></section></div><div style="margin-top:18px"><section class="panel" style="padding:18px"><div class="sec-t">카드 상태 보드</div><div class="board">${STATUS.map((s,i)=>{const L=C.filter(c=>c.status===i);return `<div class="col"><h4>${stBadge(i)}<span class="muted">${L.length}</span></h4>${L.map(c=>`<div class="mini" ${c.urgent&&c.status<4?'style="border-color:var(--red)"':''}>${TYPES[c.type].ic} ${esc(c.title)}${c.assignee?`<div class="muted" style="font-size:11.5px">👤 ${esc(c.assignee)}</div>`:''}</div>`).join('')}</div>`}).join('')}</div>
   </section></div>`;
}
const FAQ_DRAFT={
  f1:{key:'m-receipt',title:'영수증 용지 교체',type:'재고·발주',loc:'storage',locText:'창고 선반 A 맨 위 (흰 상자) · 프린터는 포스 오른쪽',purpose:'영수증 용지가 떨어지면 카드 결제 영수증을 못 뽑아요. 프린터 빨간불이 깜빡이면 바로 교체해요.',steps:['포스 오른쪽 프린터 덮개 버튼 누르기','다 쓴 심 빼고 새 롤을 종이 끝이 위로 오게 넣기','종이를 2cm 빼고 덮개 닫기','「FEED」 버튼으로 시험 출력','창고 재고가 3롤 이하면 사장님께 알리기'],cautions:['감열지라 거꾸로 넣으면 글자가 안 나와요'],terms:[['감열지','열로 글자가 찍히는 영수증 용지']]},
  f2:{key:'m-oat',title:'오트밀크 재고 확인',type:'재고·발주',loc:'storage',locText:'창고 선반 B (두유 옆)',purpose:'오트밀크는 우유와 다른 거래처라 별도로 확인해요.',steps:['창고 선반 B에서 남은 팩 수 확인','4팩 이하면 발주 앱 「오트」 거래처 선택','6팩 단위로 발주'],cautions:['개봉 후 냉장 5일 이내 사용'],terms:[['거래처','물건을 납품하는 업체']]},
  f3:{key:'m-showcase',title:'마감 시 쇼케이스 온도 설정',type:'청소·위생',loc:'showcase',locText:'카운터 앞 쇼케이스 하단 패널',purpose:'마감 후 케이크 보관 온도를 지켜야 다음 날 판매할 수 있어요.',steps:['하단 패널 「SET」 3초','온도를 3℃로 맞추기','조명 OFF, 커튼 내리기'],cautions:['5℃ 이상이면 사장님께 알리기'],terms:[['SET','설정 모드 버튼']]}
};
function draftManual(fid){
  const f=S.faqs.find(x=>x.id===fid), d=FAQ_DRAFT[fid];
  S.modal=()=>`<div class="scrim" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal"><span class="ai-tag">AI가 쓴 매뉴얼 초안</span><h2 class="h1" style="margin:10px 0 2px">${esc(d.title)}</h2><p class="muted" style="margin:0 0 12px">근무자 질문 “${esc(f.q)}” ${f.n}회에서 생성</p>
   <p style="margin:0 0 10px">${esc(d.purpose)}</p><div style="font-weight:700;margin-bottom:6px">📍 ${esc(d.locText)}</div>
   <ol class="steps">${d.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol>
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="S.modal=null;render()">나중에</button><button class="btn primary lg" onclick="approve('${fid}')">✔ 승인하고 매뉴얼에 추가</button></div></div></div>`;
  render();
}
function approve(fid){const f=S.faqs.find(x=>x.id===fid),d=FAQ_DRAFT[fid];f.approved=true;S.manuals[d.key]={...d,views:0,isNew:true};S.modal=null;render();toast(`📘 「${d.title}」 매뉴얼이 등록됐어요. 이제 모든 근무자가 볼 수 있어요`)}

/* ---- 교대 마감 / 자동 승계 ---- */
function endShift(){
  const me=W(S.worker), idx=WORKERS.indexOf(me), nxt=WORKERS[(idx+1)%3];
  const open=S.cards.filter(c=>c.status<4), mine=S.cards.filter(c=>c.shift===S.shiftNo), done=S.cards.filter(c=>c.status===4);
  S.modal=()=>`<div class="scrim"><div class="modal"><h2 class="h1" style="margin:0">${me.name}님, 수고하셨어요 👋</h2><p class="muted" style="margin:4px 0 0">${me.shift} 근무를 마감할게요.</p>
   <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin:16px 0 4px"><div class="panel kpi"><small>내가 남긴 카드</small><div class="v">${mine.length}</div></div><div class="panel kpi"><small>완료</small><div class="v" style="color:var(--green)">${done.length}</div></div><div class="panel kpi"><small>다음 교대로 승계</small><div class="v" style="color:var(--orange)">${open.length}</div></div></div>
   <div class="sec-t" style="margin-top:14px">🔁 ${nxt.name}님(${nxt.shift.split(' ')[0]})에게 넘어가는 카드</div>
   <div class="hand" id="hand">${open.map(c=>`<div class="it">${TYPES[c.type].ic} <b style="flex:1">${esc(c.title)}</b>${stBadge(c.status)}${c.shift===S.shiftNo?'<span class="tag brand">새 카드</span>':`<span class="tag orange">이월 ${c.carry+1}회차</span>`}</div>`).join('')}</div>
   <div class="row" style="justify-content:flex-end"><button class="btn" onclick="S.modal=null;render()">계속 근무</button><button class="btn primary lg" onclick="doHandover('${nxt.id}')">교대 마감하고 넘기기 ➜</button></div></div></div>`;
  render();
}
function doHandover(nid){
  document.querySelectorAll('#hand .it').forEach((e,i)=>{e.style.animationDelay=(i*.12)+'s';e.classList.add('go')});
  setTimeout(()=>{
    const me=W(S.worker).name;let n=0;
    S.cards.forEach(c=>{c.fresh=false;if(c.status<4){if(c.shift!==S.shiftNo)c.carry++;n++;if(c.status===1)c.status=0}});
    notify('🔁 교대 완료',`${me} → ${W(nid).name} · 미해결 ${n}건 자동 승계`);
    S.shiftNo++;S.bannerCarry=n;S.modal=null;S.worker=null;S.nextWorker=nid;S.view='login';
    S.clock=new Date(2026,10,19,13,1,10).getTime();render();
  },900);
}

/* ---- 점주 폰 (실시간 동기화 미리보기) ---- */
function renderPhone(){
  const el=$('#phone');if(!el)return;
  const th=S.phoneThread;const c=card(th);
  const L=S.chats[th]||[];
  el.innerHTML=`<div class="lbl"><span class="live"></span> 점주 휴대폰 · 실시간 동기화</div><div class="phone"><div class="notch"></div>
  ${S.phonePush?`<div class="banner-push"><b>슬라이딩시프트 · 지금</b>${esc(S.phonePush.title)}<br>${esc(S.phonePush.text)}</div>`:''}
  <div class="ph-top"><b>👑 ${OWNER}</b><div class="muted" style="font-size:11.5px">카페 온기 성수점 · 미해결 ${openCount()}건</div>
  <div class="tabs"><button class="${S.phoneTab==='noti'?'on':''}" onclick="S.phoneTab='noti';renderPhone()">알림 ${S.notis.filter(n=>n.fresh).length?'•':''}</button><button class="${S.phoneTab==='chat'?'on':''}" onclick="S.phoneTab='chat';renderPhone()">대화</button></div></div>
  ${S.phoneTab==='noti'?`<div class="body">${S.notis.map(n=>`<div class="noti ${n.fresh?'new':''}"><b>${esc(n.title)}</b>${esc(n.text)}<br><small>${esc(n.t)}</small></div>`).join('')}</div>`:
   `<div class="body" style="padding:0"><div style="padding:8px 12px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)">${c?TYPES[c.type].ic+' '+esc(c.title):'📌 매장 공지'}</div><div class="msgs" id="pmsgs">${L.map(m=>bubble(m,true)).join('')}${S.phoneTyping?'<div class="msg me typing"><div class="bub" style="background:var(--brand)"><i style="background:#fff"></i><i style="background:#fff"></i><i style="background:#fff"></i></div></div>':''}</div></div>
   <form class="send" onsubmit="event.preventDefault();ownerSend('${th}',this.m.value)"><input name="m" placeholder="답장 보내기…" autocomplete="off"><button class="btn primary" style="padding:8px 12px">↑</button></form>`}
  </div>`;
  S.notis.forEach(n=>{if(n.fresh)setTimeout(()=>{n.fresh=false},1500)});
  const pm=$('#pmsgs');if(pm)pm.scrollTop=pm.scrollHeight;
}
function togglePhone(){S.phone=!S.phone;render()}

/* ---- 네비게이션 ---- */
function go(v){if(v!=='rec-voice'){clearInterval(S.recTimer);if(S.sr){try{S.sr.stop()}catch(e){}S.sr=null}}S.view=v;if(v==='chat')S.afterRender=scrollMsgs;render();const c=$('#content');if(c)c.scrollTop=0}
function resetDemo(){clearInterval(S.recTimer);S=seed();render();toast('데모를 처음 상태로 되돌렸어요')}
// 메시지 보내면 폰은 자동으로 대화 탭으로
const _notify=notify;notify=function(t,x){_notify(t,x);if(/💬/.test(t)){S.phoneTab='chat';renderPhone()}};

/* 시연 순서 도우미 (? 키) */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='?'){S.modal=S.modal?null:()=>`<div class="scrim" onclick="S.modal=null;render()"><div class="modal"><h2 class="h1">3분 시연 순서</h2><ol style="line-height:2;padding-left:20px;margin:10px 0 0">
   <li><b>김지윤(오픈조)</b> 선택 → 오늘의 인수인계 둘러보기</li><li><b>빠른 기록 → 음성</b> → 녹음 끝내기 → AI 정리 과정</li><li>카드 검토 → AI 추가 질문 「오늘 중」 → 넘기기 (점주 폰 알림 확인)</li>
   <li><b>교대 마감</b> → 미해결 카드 자동 승계 → <b>이민호</b> 선택</li><li>우유 카드 → 매뉴얼 열기 (위치 도면·단계) → 담당 → 처리 중 → 완료</li><li>누수 카드 → 사장님께 메시지 → 폰에서 실시간 답장</li><li><b>점주 대시보드</b> → 반복 질문 → 매뉴얼 승인</li></ol>
   <p class="muted" style="font-size:13px;margin-top:14px">단축키: <span class="kbd">?</span> 이 창 · 왼쪽 아래 「데모 처음부터」로 초기화</p></div></div>`;
   if(S.view==='login'){S.view_='login'}render()}
});
render();
</script>
</body>
