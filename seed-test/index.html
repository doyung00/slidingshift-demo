<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라이딩시프트 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@seed-design/css@3.4.0/all.min.css">
<style>
/* 컴포넌트는 SEED Design(@seed-design/css) 클래스를 그대로 쓰고, 여기에는 화면 배치만 둔다. */
:root{
  /* SEED 브랜드 색(캐럿)을 FillMap primary(#0066CC)로 교체 — 이 블록을 지우면 SEED 기본 캐럿으로 돌아간다 */
  --seed-color-bg-brand-solid:#0066CC;
  --seed-color-bg-brand-solid-pressed:color-mix(in srgb,#0066CC 86%,#000);
  --seed-color-bg-brand-weak:#E8F5FF;
  --seed-color-bg-brand-weak-pressed:color-mix(in srgb,#E8F5FF 92%,#0066CC);
  --seed-color-fg-brand:#0066CC;
  --seed-color-fg-brand-contrast:color-mix(in srgb,#0066CC 86%,#000);
  --seed-color-stroke-brand-solid:#0066CC;
  --seed-color-stroke-brand-weak:color-mix(in srgb,#0066CC 30%,#fff);
  /* 도면·컵 그림(원본 SVG)이 쓰는 옛 변수 */
  --line:var(--seed-color-stroke-neutral-weak); --brand:var(--seed-color-bg-brand-solid); --ink2:var(--seed-color-fg-neutral-muted);
  --surface2:var(--seed-color-bg-neutral-weak); --surface:var(--seed-color-bg-layer-default);
  --fg:var(--seed-color-fg-neutral); --fg2:var(--seed-color-fg-neutral-muted); --fg3:var(--seed-color-fg-neutral-subtle);
  --bd:var(--seed-color-stroke-neutral-weak); --bd2:var(--seed-color-stroke-neutral-subtle); --bg2:var(--seed-color-bg-neutral-weak);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--seed-color-bg-layer-default);color:var(--fg);font-family:var(--seed-font-family);font-size:var(--seed-font-size-t4);line-height:var(--seed-line-height-t4);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:var(--fg)}
b,strong{font-weight:var(--seed-font-weight-bold)}
p{margin:0}
.i{flex:none;display:block}
.muted{color:var(--fg3)}
.t2{font-size:var(--seed-font-size-t2);line-height:var(--seed-line-height-t2)}
.grow{flex:1}
.row{display:flex;gap:var(--seed-dimension-x2);align-items:center;flex-wrap:wrap}
.crit{color:var(--seed-color-fg-critical)}
.pos{color:var(--seed-color-fg-positive)}
.linkb{color:var(--fg3);text-decoration:underline;font-size:var(--seed-font-size-t3)}
.seed-action-button{font-family:inherit}
.seed-badge__root{flex:none;vertical-align:middle}
.seed-chip__root{font-size:var(--seed-font-size-t3)}

/* 틀 */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}
.app.with-phone{grid-template-columns:240px 1fr 360px}
.side{border-right:1px solid var(--bd2);display:flex;flex-direction:column;padding:var(--seed-dimension-x5) var(--seed-dimension-x3)}
.logo{display:flex;align-items:center;gap:var(--seed-dimension-x2_5);padding:0 var(--seed-dimension-x2) var(--seed-dimension-x5)}
.logo-mark{flex:none;display:block}
.logo b{display:block;font-size:var(--seed-font-size-t5);line-height:var(--seed-line-height-t5)}
.logo small{color:var(--fg3);font-size:var(--seed-font-size-t2);line-height:var(--seed-line-height-t2)}
.side-nav{display:flex;flex-direction:column;gap:var(--seed-dimension-x0_5)}
.side-nav .seed-notification-badge{flex:none;margin-right:var(--seed-dimension-x1)}
.side .sep{height:1px;background:var(--bd2);margin:var(--seed-dimension-x2) var(--seed-dimension-x2)}
.side .foot{margin-top:auto;font-size:var(--seed-font-size-t2);line-height:var(--seed-line-height-t3);color:var(--fg3);padding:var(--seed-dimension-x2)}
.side .foot button{text-decoration:underline}
.kbd{font-size:var(--seed-font-size-t1);padding:1px 6px;border-radius:var(--seed-radius-r1);border:1px solid var(--bd);background:var(--bg2)}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:var(--seed-dimension-x3);padding:var(--seed-dimension-x3) var(--seed-dimension-x8);border-bottom:1px solid var(--bd2)}
.store{white-space:nowrap}
.store b{display:block}
.store small{color:var(--fg3);font-size:var(--seed-font-size-t2)}
.clockchip{display:inline-flex;align-items:center;gap:var(--seed-dimension-x1_5);color:var(--fg2);font-weight:var(--seed-font-weight-medium)}
.clock{font-variant-numeric:tabular-nums}
.duties{display:flex;gap:var(--seed-dimension-x1_5);padding-left:var(--seed-dimension-x3);border-left:1px solid var(--bd2)}
.content{flex:1;overflow:auto;padding:var(--seed-dimension-x8) var(--seed-dimension-x8) var(--seed-dimension-x16)}
.content>*{max-width:1080px}

/* 페이지 머리 · 구획 */
.pghead{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--seed-dimension-x4);flex-wrap:wrap;margin-bottom:var(--seed-dimension-x5)}
.pghead-r{display:flex;gap:var(--seed-dimension-x2);align-items:center}
.t-title{font-size:var(--seed-font-size-t9);line-height:var(--seed-line-height-t9);font-weight:var(--seed-font-weight-bold);margin:0}
.t-sub{color:var(--fg3);margin-top:var(--seed-dimension-x1)}
.backb{margin:calc(var(--seed-dimension-x3) * -1) 0 var(--seed-dimension-x3) calc(var(--seed-dimension-x3) * -1)}
.tags{display:flex;align-items:center;gap:var(--seed-dimension-x1_5);flex-wrap:wrap;margin-bottom:var(--seed-dimension-x2)}
.tags .right{margin-left:auto}
.tg{display:inline-flex;gap:var(--seed-dimension-x1);margin-left:var(--seed-dimension-x2);vertical-align:middle}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--seed-dimension-x10);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--seed-dimension-x6);min-width:0}
.sec{min-width:0}
.sec+.sec{margin-top:var(--seed-dimension-x6)}
.sec-h{padding-inline:0}
.sec-h .cnt{color:var(--fg3);font-weight:var(--seed-font-weight-regular);margin-left:var(--seed-dimension-x1)}
.sec-h .aux{font-weight:var(--seed-font-weight-regular);color:var(--fg3);font-size:var(--seed-font-size-t3)}
.sec-d{color:var(--fg3);font-size:var(--seed-font-size-t3);line-height:var(--seed-line-height-t3);margin:calc(var(--seed-dimension-x1) * -1) 0 var(--seed-dimension-x2)}
.filters{display:flex;gap:var(--seed-dimension-x1_5);flex-wrap:wrap;margin-bottom:var(--seed-dimension-x4)}
.stack{display:flex;flex-direction:column;gap:var(--seed-dimension-x3);margin-bottom:var(--seed-dimension-x5)}

/* 목록 (SEED ListItem) */
.list{margin-inline:calc(var(--seed-dimension-spacing-x-global-gutter) * -1);border-top:1px solid var(--bd2)}
.lrow{border-bottom:1px solid var(--bd2)}
.lrow .seed-list-item__content{cursor:default;padding:0;min-width:0;flex-shrink:1}
.lrow button.seed-list-item__content{cursor:pointer}
.lrow .seed-list-item__title{flex-shrink:1}
.lrow .seed-list-item__suffix{gap:var(--seed-dimension-x2);color:var(--fg3);padding-left:var(--seed-dimension-x3)}
.lrow.strong .seed-list-item__title{font-weight:var(--seed-font-weight-medium)}
.lrow.done{opacity:.55}
.lrow.newin{animation:pop .6s ease}
@keyframes pop{0%{background:var(--seed-color-bg-brand-weak)}100%{background:transparent}}
.meta-r{font-size:var(--seed-font-size-t3);color:var(--fg3);white-space:nowrap}
.av-fb{background:var(--bg2);background-image:none;color:var(--fg2);font-size:var(--seed-font-size-t2);font-weight:var(--seed-font-weight-medium);z-index:0}
.empty{color:var(--fg3);padding:var(--seed-dimension-x6) 0}

/* 값 목록 */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--seed-dimension-x6);margin:0;border-top:1px solid var(--bd2)}
.kv>div{padding:var(--seed-dimension-x3) 0;border-bottom:1px solid var(--bd2)}
.kv dt{color:var(--fg3);font-size:var(--seed-font-size-t3);line-height:var(--seed-line-height-t3)}
.kv dd{margin:var(--seed-dimension-x0_5) 0 0;font-size:var(--seed-font-size-t5);line-height:var(--seed-line-height-t5);font-weight:var(--seed-font-weight-medium)}
.lbl{font-weight:var(--seed-font-weight-bold);margin-bottom:var(--seed-dimension-x2)}
.lbl span{font-weight:var(--seed-font-weight-regular);color:var(--fg3);font-size:var(--seed-font-size-t3);margin-left:var(--seed-dimension-x1)}
.chips{display:flex;gap:var(--seed-dimension-x1_5);flex-wrap:wrap}
.origin{display:flex;gap:var(--seed-dimension-x3);align-items:flex-start;background:var(--bg2);border-radius:var(--seed-radius-r3);padding:var(--seed-dimension-x3_5)}
.origin-ic{color:var(--fg3);flex:none;padding-top:1px}
.quote{color:var(--fg2)}
.audio{display:flex;align-items:center;gap:var(--seed-dimension-x2);margin-top:var(--seed-dimension-x1_5);font-size:var(--seed-font-size-t2);color:var(--fg3)}
.audio .bars{display:flex;gap:2px;align-items:center;height:16px}
.audio .bars i{width:2px;background:var(--fg3);border-radius:1px}
.shot{aspect-ratio:8/5;background:var(--bg2);border-radius:var(--seed-radius-r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--seed-dimension-x1_5);color:var(--fg3);font-size:var(--seed-font-size-t2);text-align:center;padding:var(--seed-dimension-x2)}
.shot em{font-style:normal}
.origin .shot{width:150px;flex:none}
.seed-callout__root{border-radius:var(--seed-radius-r3)}
.seed-callout__content ul{margin:var(--seed-dimension-x1) 0 0;padding-left:var(--seed-dimension-x5)}
.seed-callout__content .chips{margin-top:var(--seed-dimension-x2_5)}

/* 단체방 */
.chat{display:flex;flex-direction:column;min-height:320px}
.msgs{flex:1;overflow:auto;padding:var(--seed-dimension-x4);display:flex;flex-direction:column;gap:var(--seed-dimension-x2_5);background:var(--bg2);border-radius:var(--seed-radius-r3);min-height:220px;max-height:420px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:var(--seed-dimension-x0_5);align-items:flex-start}
.msg .who{font-size:var(--seed-font-size-t1);color:var(--fg3)}
.msg .bub{padding:var(--seed-dimension-x2) var(--seed-dimension-x3);border-radius:var(--seed-radius-r4);background:var(--seed-color-bg-layer-default)}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--seed-color-bg-brand-solid);color:var(--seed-color-fg-on-brand-solid)}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .bub{background:transparent;color:var(--fg3);font-size:var(--seed-font-size-t2);padding:2px}
.msg.new{animation:rise .3s ease}
@keyframes rise{from{transform:translateY(6px);opacity:0}}
.typing .bub{display:flex;gap:4px;padding:var(--seed-dimension-x3)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--fg3);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.msg.me.typing i{background:var(--seed-color-fg-on-brand-solid)}
@keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
.send{display:flex;gap:var(--seed-dimension-x2);margin-top:var(--seed-dimension-x2_5)}
.quick{display:flex;gap:var(--seed-dimension-x1_5);flex-wrap:wrap;margin-top:var(--seed-dimension-x2_5)}
.tools{display:flex;gap:var(--seed-dimension-x2);margin-top:var(--seed-dimension-x3);flex-wrap:wrap;align-items:center}
.mcardmsg{display:flex;flex-direction:column;gap:var(--seed-dimension-x1);text-align:left;padding:var(--seed-dimension-x3);border-radius:var(--seed-radius-r3);box-shadow:inset 0 0 0 1px var(--bd);background:var(--seed-color-bg-layer-default);min-width:240px}
.mcardmsg .tags{margin:0}
.mcardmsg .go{color:var(--seed-color-fg-brand);font-size:var(--seed-font-size-t2);font-weight:var(--seed-font-weight-medium)}
.ctag{font-size:var(--seed-font-size-t1);color:var(--fg3);cursor:pointer;text-decoration:underline}
.suggest{align-self:stretch}
.room{display:grid;grid-template-columns:1fr 300px;gap:var(--seed-dimension-x10);align-items:start}
.room .msgs{max-height:none;flex:none;height:calc(100vh - 440px);min-height:300px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--seed-color-bg-positive-solid);animation:lv 1.6s infinite}
@keyframes lv{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--seed-color-bg-positive-solid) 50%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

/* 기록 */
.recwrap{max-width:640px;margin:0 auto;text-align:center;padding:var(--seed-dimension-x8) 0}
.mic{width:112px;height:112px;border-radius:50%;background:var(--seed-color-bg-critical-solid);display:grid;place-items:center;margin:var(--seed-dimension-x6) auto var(--seed-dimension-x4);color:var(--seed-color-fg-on-critical-solid);position:relative}
.mic::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--seed-color-bg-critical-solid);animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.2);opacity:0}}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:48px;margin-bottom:var(--seed-dimension-x3)}
.wave i{width:4px;border-radius:2px;background:var(--fg3);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:40px}}
.transcript{min-height:84px;font-size:var(--seed-font-size-t6);line-height:var(--seed-line-height-t6);padding:var(--seed-dimension-x4);border-radius:var(--seed-radius-r3);box-shadow:inset 0 0 0 1px var(--bd);text-align:left;margin:var(--seed-dimension-x3) 0 var(--seed-dimension-x5)}
.transcript .cur{display:inline-block;width:2px;height:18px;background:var(--fg);vertical-align:middle;animation:tp .8s infinite}
.ai-steps{list-style:none;padding:0;margin:var(--seed-dimension-x6) auto;max-width:360px;text-align:left;display:flex;flex-direction:column;gap:var(--seed-dimension-x3)}
.ai-steps li{display:flex;gap:var(--seed-dimension-x3);align-items:center;font-size:var(--seed-font-size-t5);color:var(--fg3)}
.ai-steps li .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none}
.ai-steps li.run,.ai-steps li.ok{color:var(--fg)}
.ai-steps li.run .d{border-color:var(--fg);border-top-color:transparent;animation:spin .8s linear infinite}
.ai-steps li.ok .d{background:var(--fg);border-color:var(--fg);color:var(--seed-color-bg-layer-default)}
@keyframes spin{to{transform:rotate(360deg)}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--seed-dimension-x3);margin-bottom:var(--seed-dimension-x5)}
.photos button{text-align:left;display:flex;flex-direction:column;gap:var(--seed-dimension-x2);font-weight:var(--seed-font-weight-medium)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--seed-dimension-x4)}
.fld{display:flex;flex-direction:column;gap:var(--seed-dimension-x1_5)}
.fld.wide{grid-column:1/-1}
.fld-l{font-size:var(--seed-font-size-t3);font-weight:var(--seed-font-weight-medium);color:var(--fg2)}
.fld.miss .fld-l{color:var(--seed-color-fg-warning)}
.fld.miss .seed-text-input__root{box-shadow:inset 0 0 0 1px var(--seed-color-stroke-warning-solid)}
.sel{border:0;box-shadow:inset 0 0 0 1px var(--bd);border-radius:var(--seed-radius-r2);padding:var(--seed-dimension-x1_5) var(--seed-dimension-x3);background:var(--seed-color-bg-layer-default);font-weight:var(--seed-font-weight-medium)}

/* 매뉴얼 */
.mtools{display:flex;flex-direction:column;gap:var(--seed-dimension-x3);margin-bottom:var(--seed-dimension-x5)}
.mtools .seed-text-input__root{max-width:380px}
.mtools .seed-tabs__list{--seed-dimension-spacing-x-global-gutter:0px}
.seed-tabs__trigger{padding:var(--seed-dimension-x3) var(--seed-dimension-x3);font-family:inherit;font-size:var(--seed-font-size-t5);font-weight:var(--seed-font-weight-bold);gap:var(--seed-dimension-x1)}
.seed-tabs__trigger em{font-style:normal;font-weight:var(--seed-font-weight-regular);color:var(--fg3)}
.seed-segmented-control__item{font-family:inherit;border:0;background:none}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd2)}
.steps li{display:flex;gap:var(--seed-dimension-x3);align-items:flex-start;padding:var(--seed-dimension-x3) 0;border-bottom:1px solid var(--bd2);cursor:pointer;font-size:var(--seed-font-size-t5);line-height:var(--seed-line-height-t5)}
.steps li .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--bd);color:var(--fg2);font-size:var(--seed-font-size-t2);font-weight:var(--seed-font-weight-bold)}
.steps li.ok .n{background:var(--seed-color-bg-brand-solid);box-shadow:none;color:var(--seed-color-fg-on-brand-solid)}
.steps li.ok span:last-child{color:var(--fg3);text-decoration:line-through}
.steps.static li{cursor:default}
.terms{display:grid;grid-template-columns:auto 1fr;gap:var(--seed-dimension-x2) var(--seed-dimension-x4);margin:0}
.terms dt{font-weight:var(--seed-font-weight-bold)} .terms dd{margin:0;color:var(--fg2)}
.loc{font-weight:var(--seed-font-weight-medium);margin-bottom:var(--seed-dimension-x3)}
.plan{width:100%;height:auto;display:block;border-radius:var(--seed-radius-r3);background:var(--bg2)}
.plan .z{fill:var(--seed-color-bg-layer-default);stroke:var(--bd);stroke-width:1}
.plan .z.hl{fill:var(--seed-color-bg-brand-weak);stroke:var(--seed-color-bg-brand-solid);stroke-width:2}
.plan text{font-size:11px;fill:var(--fg3);font-family:inherit}
.plan text.hl{fill:var(--seed-color-fg-brand);font-weight:700}
.plan .pulse{fill:var(--seed-color-bg-brand-solid);transform-origin:center;transform-box:fill-box;animation:pl 1.4s infinite}
@keyframes pl{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.video{aspect-ratio:16/9;border-radius:var(--seed-radius-r3);background:var(--seed-color-bg-neutral-inverted);display:grid;place-items:center;color:var(--seed-color-fg-neutral-inverted);position:relative;margin-top:var(--seed-dimension-x3)}
.video small{position:absolute;left:12px;bottom:10px;opacity:.8}
.ings{width:100%;border-collapse:collapse;font-size:var(--seed-font-size-t5)}
.ings td{padding:var(--seed-dimension-x3) 0;border-bottom:1px solid var(--bd2)}
.ings tr:first-child td{border-top:1px solid var(--bd2)}
.ings td:last-child{text-align:right;font-weight:var(--seed-font-weight-bold);font-variant-numeric:tabular-nums}
.cupwrap{display:flex;gap:var(--seed-dimension-x5);align-items:center;margin-bottom:var(--seed-dimension-x6)}
.cupwrap svg{width:120px;flex:none}
.legend{display:flex;flex-direction:column;gap:var(--seed-dimension-x1_5);font-size:var(--seed-font-size-t3)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px var(--bd)}

/* 대시보드 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--bd2);margin-bottom:var(--seed-dimension-x8)}
.stat{padding:var(--seed-dimension-x4) var(--seed-dimension-x5)}
.stat:first-child{padding-left:0}
.stat+.stat{border-left:1px solid var(--bd2)}
.stat small{color:var(--fg3);font-size:var(--seed-font-size-t3)}
.stat .v{font-size:var(--seed-font-size-t10);line-height:var(--seed-line-height-t10);font-weight:var(--seed-font-weight-bold);font-variant-numeric:tabular-nums}
.stat .v span{font-size:var(--seed-font-size-t5);font-weight:var(--seed-font-weight-medium);color:var(--fg3)}
.stat .d{font-size:var(--seed-font-size-t3);color:var(--fg3)}
.stat .d.pos{color:var(--seed-color-fg-positive)}
.bars{display:flex;align-items:flex-end;gap:var(--seed-dimension-x3);padding-top:var(--seed-dimension-x3)}
.bars .b{flex:1;min-width:0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:var(--seed-dimension-x1_5);font-size:var(--seed-font-size-t2);color:var(--fg3)}
.bars .b i{width:100%;max-width:40px;border-radius:var(--seed-radius-r1) var(--seed-radius-r1) 0 0;background:var(--seed-color-bg-brand-solid);display:block}
.bars .b.before i{background:var(--seed-color-palette-gray-400)}
.bars .b em{font-style:normal;font-weight:var(--seed-font-weight-bold);color:var(--fg);font-size:var(--seed-font-size-t3)}
.alog{width:100%;border-collapse:collapse}
.alog td{padding:var(--seed-dimension-x2_5) 0;border-bottom:1px solid var(--bd2)}

function analyze(text,preset){
  if(preset) return JSON.parse(JSON.stringify(preset));
  const t=text.replace(/\s+/g,' ').trim();
  let type='기타';
  if(/발주|재고|떨어|남았|부족|채워|모자/.test(t))type='재고·발주';
  if(/예약|단체|픽업/.test(t))type='주문·예약';
  if(/청소|위생|쓰레기|닦|소독/.test(t))type='청소·위생';
  if(/고장|새요|새고|샌다|누수|안 ?돼|안 ?나와|에러|경고|이상한 소리|멈췄|작동/.test(t))type='장비 이상';
  const qm=t.match(/(\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*(팩|개|박스|잔|봉지|봉|통|병|롤|장|kg|L|리터)/);
  const qty=qm?((KNUM[qm[1]]||qm[1])+qm[2]):'';
  const LOCS=['워크인 냉장고','냉장고','냉동고','창고','카운터','포스','에스프레소 머신','그라인더','제빙기','스팀 노즐','그룹','화장실','홀','테라스','오븐','쇼케이스','선반'];
  const loc=(LOCS.find(l=>t.includes(l))||'');
  const dm=t.match(/(오늘|내일|모레|이번 ?주|주말|[월화수목금토일]요일)?\s*(오전|오후)?\s*(\d{1,2}|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|열한|열두)\s*시\s*(반)?\s*(전|까지)?/);
  let due='';
  if(dm&&dm[0].trim().length>1){due=dm[0].trim().replace(/(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)(?=\s*시)/,m=>({'한':1,'두':2,'세':3,'네':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10,'열한':11,'열두':12}[m]))}
  else{const d2=t.match(/오늘|내일|모레|이번 ?주|주말/);if(d2)due=d2[0]}
  let first=t.split(/[.!?。\n]/)[0].trim(); if(first.length>26)first=first.slice(0,25)+'…';

  const manMap={'재고·발주':'m-milk','장비 이상':'m-espresso','주문·예약':'m-group','청소·위생':'m-grinder','기타':null};
  return {type,title:first||'새 인수인계',qty:qty||'-',loc,next:nextMap[type],due,urgent:/급|빨리|당장|지금/.test(t),manual:manMap[type],

}

  if(S.view==='attend'||!S.worker)S.view='attend';
  r.innerHTML=`<div class="app ${S.phone?'with-phone':''}">${side()}<main class="main">${topbar()}<div class="content" id="content">${body()}</div></main>${S.phone?'<aside class="phone-wrap" id="phone"></aside>':''}</div>${S.modal?S.modal():''}`;
  renderPhone();fixTabs();
  if(S.afterRender){const f=S.afterRender;S.afterRender=null;f()}
}
function side(){
  const unread=S.cards.filter(c=>c.status===0).length;
  const isOn=v=>S.view===v||(v==='home'&&S.view==='card')||(v==='manuals'&&S.view==='manual')||(v==='chat'&&(S.view.startsWith('rec')||S.view==='review'));
  const n=(v,ic,l)=>{const c=isOn(v)?'data-current':'';return `<button type="button" class="seed-side-navigation-menu-item__root" ${c} onclick="${S.worker||v==='attend'?`go('${v}')`:`toast('먼저 출근하거나 근무 중인 사람을 선택해 주세요')`}"><span class="seed-side-navigation-menu-item__prefixIcon" ${c}>${icon(ic)}</span><span class="seed-side-navigation-menu-item__label" ${c}>${l}</span>${v==='home'&&unread?`<span class="seed-notification-badge seed-notification-badge--size_large">${unread}</span>`:''}</button>`};
  return `<nav class="side"><div class="logo">${logoMark()}<div><b>슬라이딩시프트</b><small>AI 인수인계 · 업무 매뉴얼</small></div></div>
  <div class="side-nav">${n('home','home','오늘의 인수인계')}${n('chat','chat','소통 · 기록')}${n('manuals','book','업무 매뉴얼')}${n('attend','clock','출퇴근')}<div class="sep"></div>${n('admin','chart','점주 대시보드')}</div>
  <div class="foot">MONEY팀 시연용 데모 · 데이터는 가상입니다<br><button onclick="resetDemo()">데모 처음부터</button> · <span class="kbd">?</span> 시연 순서</div></nav>`;
}
function topbar(){
  const duty=onDuty();
  return `<header class="top"><div class="store"><b>카페 온기 성수점</b><small>공용 패드 · 근무 ${duty.length}명</small></div>
  <span class="clockchip hide-m">${icon('clock',16)}<span class="clock">${now()}</span></span>
  <div class="duties" title="눌러서 사용하는 사람 바꾸기">${duty.map(w=>chip(w.name,w.id===S.worker,`switchUser('${w.id}')`,'small')).join('')}${chip('＋',false,"go('attend')",'small','outlineWeak')}</div>
  <span class="grow"></span>
  ${btn(S.phone?'점주 폰 숨기기':'점주 폰 보기',{v:'ghost',s:'small',icon:'phone',on:'togglePhone()',cls:'hide-m'})}
  ${S.worker?btn('퇴근 · 교대 마감',{v:'neutralSolid',s:'small',on:'endShift()'}):''}</header>`;
}
function body(){
  return ({attend:viewAttend,home:viewHome,card:viewCard,'rec-voice':viewVoice,'rec-photo':viewPhoto,'rec-text':viewText,'rec-ai':viewAI,review:viewReview,manuals:viewManuals,manual:viewManual,chat:viewChat,admin:viewAdmin}[S.view]||viewHome)();
}

/* ---- [테스트] 출퇴근 · 근무자 선택 ---- */
function viewAttend(){
  const carry=openCount(), duty=onDuty();
  const stOf=w=>{const a=S.att[w.id];return a&&!a.out?'on':a&&a.out?'out':'off'};
  const rowOf=w=>{
    const a=S.att[w.id], st=stOf(w), nx=S.nextWorker===w.id&&st!=='on';
    const detail=st==='on'?`${w.shift} · ${a.in} 출근`:st==='out'?`${w.shift} · ${a.out} 퇴근`:w.shift;
    const suffix=st==='on'?btn('이 패드 사용',{v:'brandSolid',s:'small',on:`useAs('${w.id}')`})+btn('퇴근',{s:'small',on:`S.worker='${w.id}';endShift()`})
      :btn(st==='out'?'다시 출근':'출근하기',{v:nx?'brandSolid':'neutralWeak',s:'small',on:`clockIn('${w.id}')`});
    return row({prefix:av(w,42),title:w.name+`<span class="tg">${nx?badge('다음 교대','brand'):''}${S.worker===w.id&&st==='on'?badge('사용 중','neutral','outline'):''}</span>`,detail,suffix});
  };
  const off=WORKERS.filter(w=>stOf(w)==='off').sort((a,b)=>(S.nextWorker===b.id)-(S.nextWorker===a.id)), out=WORKERS.filter(w=>stOf(w)==='out');
  const sec=(t,L)=>L.length?`<section class="sec">${secH(`${t}<span class="cnt">${L.length}</span>`)}<div class="list">${L.map(rowOf).join('')}</div></section>`:'';
  return `${pghead('출퇴근',`지금 ${duty.length}명 근무 중 · 퇴근하면 남은 일이 다음 근무자에게 넘어가요`)}
   <div class="att2"><div>
    <p class="lead">출근하셨나요? 이름 옆 ‘출근하기’를 눌러 주세요</p>
    <p class="muted" style="margin-bottom:24px">근무 중인 사람은 ‘이 패드 사용’으로 공용 패드를 바꿔 쓸 수 있어요.</p>
    ${sec('출근 전',off)}${sec('근무 중',duty)}${sec('퇴근',out)}
   </div><div>
    ${callout('informative','인수인계',`확인할 카드 <b>${carry}개</b>가 기다리고 있어요.`)}
    <section class="sec" style="margin-top:24px">${secH('오늘 출퇴근 기록')}${attTable(6)}</section>
   </div></div>`;
}
function attTable(limit){
  const L=[...S.attLog].reverse().slice(0,limit||99);
  return `<table class="alog">${L.map(e=>`<tr><td>${e.t}</td><td>${W(e.id).name} <span class="muted t2">${W(e.id).shift.split(' ')[0]}</span></td><td>${e.kind==='in'?badge('출근','positive'):badge('퇴근','neutral')}</td></tr>`).join('')}</table>`;
}
function clockIn(id){
  S.att[id]={in:now(),out:null};S.attLog.push({id,kind:'in',t:now()});
  notify('🕘 출근',`${W(id).name} (${W(id).shift.split(' ')[0]})`);
  if(S.nextWorker===id)S.nextWorker=null;
  S.worker=id;S.view='home';S.filter='all';render();toast(`${W(id).name}님, ${now()} 출근 기록됐어요 👋`);
}
function useAs(id){S.worker=id;S.view='home';S.filter='all';render();toast(`${W(id).name}님으로 패드를 사용해요`)}
function switchUser(id){if(S.worker===id)return;S.worker=id;render();toast(`👤 ${W(id).name}님으로 바꿨어요`)}

/* ---- 홈 ---- */
function viewHome(){
  const w=W(S.worker);
  let list=[...S.cards].sort((a,b)=>(a.status===4)-(b.status===4)||(b.urgent-a.urgent)||(b.carry-a.carry)||(a.status-b.status));
  const f=S.filter;
  if(f==='open')list=list.filter(c=>c.status<4);
  if(f==='urgent')list=list.filter(c=>c.urgent&&c.status<4);
  if(f==='mine')list=list.filter(c=>c.assignee===w.name);
  const open=openCount(), urg=S.cards.filter(c=>c.urgent&&c.status<4).length;
  const fb=(k,l)=>chip(l,f===k,`S.filter='${k}';render()`);
  const G=[['먼저 처리할 일',list.filter(c=>c.urgent&&c.status<4)],['진행 중',list.filter(c=>!c.urgent&&c.status<4)],['완료',list.filter(c=>c.status===4)]];
  const groups=G.map(([t,L])=>L.length?`<section class="sec">${secH(`${t}<span class="cnt">${L.length}</span>`)}<div class="list">${L.map(hcard).join('')}</div></section>`:'').join('');
  return `${pghead(`${w.name}님, 오늘의 인수인계`,`미해결 ${open}건 · 긴급 ${urg}건`,btn('단체방',{icon:'chat',on:"go('chat')"})+btn('음성으로 기록',{v:'brandSolid',icon:'mic',on:"S.recFrom='home';startVoice()"}))}
  <div class="stack">${S.bannerCarry?callout('warning','자동 승계',`이전 교대에서 끝나지 않은 ${S.bannerCarry}건이 넘어왔어요.`,btn('닫기',{v:'ghost',s:'xsmall',on:'S.bannerCarry=0;render()'})):''}
  ${callout('neutral','공지',esc(S.notice))}</div>
  <div class="filters">${fb('all','전체')}${fb('open','미해결')}${fb('urgent','긴급')}${fb('mine','내 담당')}</div>
  ${groups||'<p class="empty">해당하는 카드가 없어요.</p>'}`;
}
function cardMsgs(id){return S.room.filter(m=>m.card===id&&m.from!=='card')}
function hcard(c){
  const msgs=cardMsgs(c.id).length, hot=c.urgent&&c.status<4;
  const tags=(hot?badge('긴급','critical'):'')+(c.carry?badge(`${c.carry}회 이월`,'warning'):'')+(c.shift===S.shiftNo-1&&c.shift>=0?badge('방금 넘어옴','brand'):'');
  const l1=[`<span class="${hot?'crit':''}">기한 ${esc(c.due||'-')}</span>`,esc(c.loc||''),c.qty&&c.qty!=='-'?esc(c.qty):''].filter(Boolean).join(' · ');
  const l2=[esc(c.type),`${esc(c.from)} · ${esc(c.at)}`,c.assignee?'담당 '+esc(c.assignee):'',msgs?'댓글 '+msgs:''].filter(Boolean).join(' · ');
  return row({cls:`strong ${c.status===4?'done':''} ${c.fresh?'newin':''}`,on:`openCard('${c.id}')`,
    title:esc(c.title)+(tags?`<span class="tg">${tags}</span>`:''),
    detail:`${l1}<br>다음 행동: ${esc(c.next)}<br><span class="t2">${l2}</span>`,
    suffix:stBadge(c.status)+icon('right',16)});
}

/* ---- 카드 상세 ---- */
function openCard(id){const c=card(id);if(!c)return;c.fresh=false;if(c.status===0){c.status=1;c.seenBy=W(S.worker).name}S.sel=id;S.view='card';S.afterRender=scrollMsgs;render()}
function viewCard(){
  const c=card(S.sel), m=c.manual&&S.manuals[c.manual];
  let act='';
  if(c.status<2)act=btn('내가 담당할게요',{v:'brandSolid',s:'large',on:'setSt(2)'});
  if(c.status===2)act=btn('처리 시작',{v:'brandSolid',s:'large',on:'setSt(3)'});
  if(c.status===3)act=btn('완료 처리',{v:'brandSolid',s:'large',icon:'check',on:'setSt(4)'});
  if(c.status===4)act=badge('처리 완료된 카드예요','positive','weak','large');
  return `${backBtn('오늘의 인수인계',"go('home')")}
  <div class="grid2"><section class="col">
   <div><div class="tags">${typeBadge(c.type)}${c.urgent&&c.status<4?badge('긴급','critical'):''}${c.carry?badge(`${c.carry}회 이월`,'warning'):''}${badge('AI 정리','brand','outline')}<span class="muted right">${esc(c.from)} · ${esc(c.at)}</span></div>
   <h1 class="t-title">${esc(c.title)}</h1></div>
   <div><div class="lbl">상태<span>눌러서 바꿀 수 있어요${c.assignee?` · 담당 ${esc(c.assignee)}`:''}</span></div>
    <div class="chips">${STATUS.map((s,i)=>chip(`${i+1} ${s}`,i===c.status,`setSt(${i})`)).join('')}</div></div>
   <dl class="kv"><div><dt>수량</dt><dd>${esc(c.qty)}</dd></div><div><dt>기한</dt><dd class="${c.urgent?'crit':''}">${esc(c.due||'-')}</dd></div><div><dt>위치</dt><dd>${esc(c.loc||'-')}</dd></div><div><dt>다음 행동</dt><dd>${esc(c.next)}</dd></div></dl>
   <div><div class="lbl">원본 기록</div>${origin(c)}</div>
   <div>${act}</div>
  </section>
  <section class="col">
   ${m?`<div><div class="lbl">업무 매뉴얼<span>처음 하는 업무라면</span></div><div class="list">${row({on:`openManual('${c.manual}','card')`,title:esc(m.title),detail:`위치 안내 · ${m.steps.length}단계 방법 · 주의사항`,suffix:icon('right',16)})}</div></div>`:''}
   ${c.recipes?`<div><div class="lbl">이 주문에 필요한 레시피</div><div class="chips">${c.recipes.map(r=>chip(esc(S.manuals[r].title),false,`openManual('${r}','card')`,'medium','outlineWeak')).join('')}</div></div>`:''}
   <div><div class="lbl">이 카드 이야기 <span class="live" title="실시간"></span><span>단체방에 함께 올라가요</span></div>${chatBox(c.id)}</div>
  </section></div>`;
}
function origin(c){
  const s=c.src;
  if(s.kind==='voice')return `<div class="origin"><div class="origin-ic">${icon('mic')}</div><div><div class="quote">“${esc(s.text)}”</div><div class="audio">${icon('play',12)}<span class="bars">${Array.from({length:28},(_,i)=>`<i style="height:${4+Math.abs(Math.sin(i*1.7))*12}px"></i>`).join('')}</span> ${s.dur||'0:12'} · 음성 원본</div></div></div>`;
  if(s.kind==='photo')return `<div class="origin">${photo(s.photo)}<div class="quote">${esc(s.text)}${s.vision?`<div class="audio">${esc(s.vision)}</div>`:''}</div></div>`;
  return `<div class="origin"><div class="origin-ic">${icon('note')}</div><div class="quote">“${esc(s.text)}”</div></div>`;
}
function setSt(i){
  const c=card(S.sel), me=W(S.worker).name;
  if(i>=2&&!c.assignee)c.assignee=me;
  if(i<2)c.assignee=null;
  c.status=i;
  if(i===2){toast(`👤 ${me}님이 담당했어요`);}
  if(i===3){toast('⏳ 처리 중으로 바꿨어요');}
  if(i===4){toast('✅ 완료! 사장님 폰에도 바로 반영돼요');notify('✅ 완료',`${c.title} (${me})`);sysMsg(`${me}님이 「${c.title}」를 완료했어요`,c.id)}
  render();
}

/* ---- [테스트] 단체방 (실시간 소통 + 빠른 기록) ---- */
function clearFresh(){S.room.forEach(m=>m.fresh=false)}
function push(m){clearFresh();m.id='m'+(++MID);m.t=m.t||now();m.fresh=true;S.room.push(m);return m}
function chatBox(cid){
  const L=cid?S.room.filter(m=>m.card===cid):S.room;
  const typing=S.typing&&(cid?S.typing===cid:true);
  const q=cid?['사진 보내드릴게요','확인했어요','지금 처리 중이에요','도움이 필요해요']:['확인했습니다!','오픈 완료했어요','잠깐 자리 비워요','도움이 필요해요'];
  const arg=cid?`'${cid}'`:'null';
  return `<div class="chat"><div class="msgs" id="msgs-${cid||'room'}">${L.length?L.map(m=>bubble(m,false,!!cid)).join(''):'<div class="msg sys"><div class="bub">아직 이 카드 이야기가 없어요. 급한 일은 여기서 바로 보내세요.</div></div>'}${typing?'<div class="msg typing"><span class="who">'+OWNER+'</span><div class="bub"><i></i><i></i><i></i></div></div>':''}</div>
  <div class="quick">${q.map(x=>chip(x,false,`sendW('${x}',${arg})`,'small','outlineWeak')).join('')}</div>
  <form class="send" onsubmit="event.preventDefault();sendW(this.m.value,${arg});">${inp({name:'m',id:'msgin',ph:cid?'이 카드에 대해 단체방에 보내기':'단체방에 보내기 · 예) 오트밀크 3팩 남음 내일까지 발주'})}${btn('보내기',{v:'brandSolid',type:'submit'})}</form>
  ${cid?'':`<div class="tools">${btn('음성으로 기록',{s:'small',icon:'mic',on:"S.recFrom='chat';startVoice()"})}${btn('사진으로 기록',{s:'small',icon:'camera',on:"S.recFrom='chat';go('rec-photo')"})}${btn('입력한 글을 카드로',{s:'small',icon:'note',on:'inputToCard()'})}<span class="muted t2">기록은 AI가 카드로 정리해 이 방에 올려요</span></div>`}</div>`;
}
function bubble(m,ownerView,inCard){
  if(m.from==='sys')return `<div class="msg sys ${m.fresh?'new':''}"><div class="bub">${esc(m.text)}</div></div>`;
  if(m.from==='suggest'){if(ownerView)return '';
    return m.done?`<div class="msg sys"><div class="bub">인수인계 카드로 만들었어요</div></div>`:`<div class="suggest ${m.fresh?'msg new':''}">${callout('magic','AI 제안','인수인계로 남겨 둘 내용 같아요. 카드로 만들면 다음 근무자에게도 넘어가요.',btn('카드로 만들기',{v:'neutralSolid',s:'small',on:`msgToCard('${m.ref}')`}))}</div>`}
  const mine=ownerView?m.from==='owner':m.from!=='owner';
  const who=m.from==='owner'?OWNER:esc(m.who);
  if(m.from==='card'){const c=card(m.card);if(!c)return '';
    return `<div class="msg ${mine?'me':''} ${m.fresh?'new':''}"><span class="who">${who} · ${esc(m.t)} · 인수인계 카드를 남겼어요</span><button type="button" class="mcardmsg" ${ownerView?'':`onclick="openCard('${c.id}')"`}><span class="tags">${typeBadge(c.type)}${c.urgent&&c.status<4?badge('긴급','critical'):''}<span class="right">${stBadge(c.status)}</span></span><b>${esc(c.title)}</b><span class="muted">기한 ${esc(c.due||'-')} · ${esc(c.next)}</span>${ownerView?'':'<span class="go">눌러서 카드 보기</span>'}</button></div>`}
  const c=m.card&&card(m.card);
  const tag=c&&!inCard?`<span class="ctag" ${ownerView?'':`onclick="openCard('${c.id}')"`}>${esc(c.title)}</span>`:'';
  return `<div class="msg ${mine?'me':''} ${m.fresh?'new':''}"><span class="who">${who} · ${esc(m.t)}</span>${tag}<div class="bub">${esc(m.text)}</div></div>`;
}
function scrollMsgs(){document.querySelectorAll('.msgs').forEach(e=>e.scrollTop=e.scrollHeight)}
function sysMsg(text,cid){push({from:'sys',text,card:cid||null})}
function sendW(text,cid){
  text=(text||'').trim();if(!text)return;
  const me=W(S.worker).name;
  const m=push({from:'w',who:me,text,card:cid||null});
  const c=cid&&card(cid);
  notify(`💬 ${me}${c?' · '+c.title:' · 단체방'}`,text);
  let sug=false;
  if(!cid){const a=analyze(text);if(a.type!=='기타'){push({from:'suggest',ref:m.id});S.room[S.room.length-2].fresh=true;sug=true}}
  S.afterRender=scrollMsgs;render();
  // 점주 자동 응답 (데모 시나리오)
  const key=cid||'room';
  S.autoReplied=S.autoReplied||{};if(S.autoReplied[key])return;S.autoReplied[key]=true;
  let reply='확인했어요, 고마워요 👍';
  if(c&&c.manual==='m-espresso')reply='헉 고마워요! 수리 기사님 오늘 4시에 오시기로 했어요. 그때까지 2번 그룹은 쓰지 말아 주세요 🙏';
  else if(c&&c.type==='재고·발주')reply='고마워요! 주말 전이니까 16팩으로 넣어 주세요.';
  else if(!cid&&sug)reply='고마워요! 카드로 남겨 주면 다음 조도 놓치지 않아요 👍';
  else if(!cid)reply='좋아요 👍 다들 고마워요!';
  setTimeout(()=>{S.typing=key;S.phoneTyping=true;S.afterRender=scrollMsgs;render()},1400);
  setTimeout(()=>{S.typing=null;S.phoneTyping=false;ownerSend(reply,cid)},3600);
}
function ownerSend(text,cid){
  text=(text||'').trim();if(!text)return;
  push({from:'owner',text,card:cid||null});
  if(!(S.view==='chat'||(S.view==='card'&&S.sel===cid)))toast(`👑 사장님: ${text.slice(0,30)}${text.length>30?'…':''}`);
  S.afterRender=scrollMsgs;render();
}
function inputToCard(){
  const el=$('#msgin');const t=el&&el.value.trim();
  if(!t){toast('먼저 남길 내용을 입력해 주세요');el&&el.focus();return}
  S.recFrom='chat';runAI({kind:'text',text:t},analyze(t),['문장 이해','문제 유형 분류','수량 · 위치 · 기한 추출','빠진 정보 확인','관련 업무 매뉴얼 연결']);
}

function backRec(){return S.recFrom||'chat'}
/* 녹음 버튼 → 바로 브라우저 내장 음성 인식(Web Speech API). 지원 안 되면 기본 시나리오로 */
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('이 브라우저는 음성 인식을 지원하지 않아 기본 시나리오로 보여 드려요 (Chrome 권장)');startScripted();return}
  startLiveVoice();
}
function startScripted(){
  stopSR();S.rec={text:'',done:false,live:false};S.view='rec-voice';render();
  let i=0;clearInterval(S.recTimer);
  S.recTimer=setInterval(()=>{ if(S.view!=='rec-voice'){clearInterval(S.recTimer);return}
    i+=2;S.rec.text=SCRIPT_VOICE.slice(0,i);
    const el=$('#tr');if(el)el.innerHTML=esc(S.rec.text)+'<span class="cur"></span>';
    const sec=$('#rsec');if(sec)sec.textContent='0:'+String(Math.min(12,Math.floor(i/6))).padStart(2,'0');
    if(i>=SCRIPT_VOICE.length){clearInterval(S.recTimer);S.rec.done=true;const b=$('#stopb');if(b){b.className=btnCls('brandSolid','large');b.textContent='녹음 끝내고 AI로 정리하기'}}
  },70);
}
function stopSR(){if(S.sr){const r=S.sr;S.sr=null;r.onend=null;try{r.stop()}catch(e){}}}
function startLiveVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  clearInterval(S.recTimer);stopSR();
  S.rec={text:'',base:'',done:false,live:true,t0:Date.now()};S.view='rec-voice';render();
  const showText=t=>{const el=$('#tr');if(el)el.innerHTML=t?esc(t)+'<span class="cur"></span>':'<span class="muted">말씀하세요… 듣고 있어요</span><span class="cur"></span>'};
  showText('');
  S.recTimer=setInterval(()=>{if(S.view!=='rec-voice'){clearInterval(S.recTimer);stopSR();return}
    const sec=Math.floor((Date.now()-S.rec.t0)/1000);const e=$('#rsec');if(e)e.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},250);
  const begin=()=>{
    const r=new SR();r.lang='ko-KR';r.interimResults=true;r.continuous=true;S.sr=r;
    r.onresult=e=>{let fin='',tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}
      if(fin)S.rec.base=(S.rec.base+' '+fin.trim()).trim();
      S.rec.text=(S.rec.base+' '+tmp.trim()).trim();showText(S.rec.text)};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){S.sr=null;r.onend=null;clearInterval(S.recTimer);toast('마이크 권한이 없어 기본 시나리오로 보여 드려요');startScripted()}
      else if(e.error==='audio-capture'){S.sr=null;r.onend=null;toast('마이크를 찾을 수 없어요');}};
    // 말이 잠깐 끊기면 크롬이 인식을 멈추므로, 녹음 중이면 자동으로 다시 시작
    r.onend=()=>{if(S.sr===r&&S.view==='rec-voice'){try{begin()}catch(e){}}};
    try{r.start()}catch(e){}
  };
  begin();
}
function viewVoice(){
  const live=S.rec&&S.rec.live, ready=S.rec.done||live;
  return `<div class="recwrap"><h1 class="t-title">듣고 있어요</h1><p class="t-sub">편하게 말하세요. 수량·위치·기한은 AI가 찾아내고, 정리된 카드는 단체방에 올라가요.</p>
  <div class="mic">${icon('mic',44)}</div><div class="wave">${Array.from({length:22},(_,i)=>`<i style="animation-delay:${(i%7)*.11}s"></i>`).join('')}</div>
  <div class="muted">녹음 중 <b id="rsec">0:00</b> · ${live?'실시간 음성 인식':'기본 시나리오'}</div>
  <div class="transcript" id="tr">${esc(S.rec.text)}<span class="cur"></span></div>
  <div class="row" style="justify-content:center">${btn('취소',{s:'large',on:'go(backRec())'})}${btn(ready?'녹음 끝내고 AI로 정리하기':'녹음 끝내기',{id:'stopb',v:ready?'brandSolid':'neutralWeak',s:'large',on:'stopVoice()'})}</div>
  <p style="margin-top:20px">${live?`<button class="linkb" onclick="startScripted()">마이크 대신 기본 시나리오로 시연하기</button>`:`<button class="linkb" onclick="startLiveVoice()">실제 마이크로 말하기 (Chrome)</button>`}</p></div>`;
}
function stopVoice(){
  clearInterval(S.recTimer);stopSR();
  const live=S.rec.live, text=live?S.rec.text:SCRIPT_VOICE;
  if(!text.trim()){toast('인식된 말이 없어요. 다시 말해 주세요');if(live)startLiveVoice();return}
  const sec=live?Math.max(1,Math.round((Date.now()-S.rec.t0)/1000)):12;
  runAI({kind:'voice',text,dur:Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},analyze(text,live?null:PRESET_VOICE),['음성 → 텍스트 변환 (STT)','문제 유형 분류','수량 · 위치 · 기한 추출','빠진 정보 확인','관련 업무 매뉴얼 연결']);
}

  ${pghead(esc(m.title),esc(m.sub),keys.length>1?seg(keys.map(k=>[k,k]),S.rv,k=>`S.rv='${k}';S.mDone={};render()`):badge('ICE 전용','informative','outline','large'))}
  <div class="grid2"><section class="col">
   <div>${secH('재료 · 분량',`<span class="aux">${esc(v.cup)}</span>`)}<table class="ings">${v.ings.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table></div>
   <div>${secH('만드는 순서',`<span class="aux">${done}/${v.steps.length} · 눌러서 체크</span>`)}${steps(v.steps)}</div>
   ${done===v.steps.length&&S.mFrom==='card'?callout('positive','다 만들었어요','',btn('카드로 돌아가기',{v:'neutralSolid',s:'small',on:"S.view='card';render()"})):''}
   ${callout('neutral','포인트',`<ul>${m.tips.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`)}</section>
  <section>${secH(`완성 모습 (${S.rv||keys[0]})`)}
   <div class="cupwrap">${cup(v)}<div class="legend">${v.layers.map(([l,p,c])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}${v.ice?'<span><i style="background:var(--seed-color-palette-blue-200)"></i>얼음</span>':''}<span class="muted t2">${esc(v.cup)}</span></div></div>
   ${secH('재료 위치')}<div class="loc">${esc(m.locText)}</div>${plan(m.loc)}</section></div>`;
}

/* ---- 점주 대시보드 ---- */
function viewAdmin(){
  const C=S.cards, openL=C.filter(c=>c.status<4).sort((a,b)=>(b.urgent-a.urgent)||(b.carry-a.carry)), done=C.filter(c=>c.status===4).length, carry=C.filter(c=>c.carry&&c.status<4).length;
  const duty=onDuty(), pend=S.faqs.filter(f=>!f.approved).length;
  return `${pghead('점주 대시보드',`매장에 없어도 지금 상황을 한눈에 · ${OWNER}`,badge('점주 모드','neutral','outline','large'))}
  <div class="stats">
   <div class="stat"><small>지금 근무 중</small><div class="v">${duty.length}<span>명</span></div><div class="d">${duty.map(w=>w.name).join(' · ')||'-'}</div></div>
   <div class="stat"><small>미해결 카드</small><div class="v">${openL.length}<span>건 · 이월 ${carry}</span></div><div class="d">완료 ${done}건 · 끝날 때까지 자동 승계</div></div>
   <div class="stat"><small>카드 확인까지 평균</small><div class="v">4<span>분</span></div><div class="d pos">단톡방 대비 78% 단축</div></div>
   <div class="stat"><small>반복 질문 (이번 달)</small><div class="v">${14-S.faqs.filter(f=>f.approved).reduce((a,f)=>a+f.n,0)}<span>건</span></div><div class="d pos">지난달 대비 42% 감소</div></div></div>
  <div class="grid2"><div class="col">
   <section>${secH(`지금 챙길 카드<span class="cnt">${openL.length}</span>`)}${openL.length?`<div class="list">${openL.map(c=>row({cls:'strong',on:`openCard('${c.id}')`,title:esc(c.title)+`<span class="tg">${c.urgent?badge('긴급','critical'):''}${c.carry?badge(`${c.carry}회 이월`,'warning'):''}</span>`,detail:`기한 ${esc(c.due||'-')} · ${c.assignee?'담당 '+esc(c.assignee):'담당 없음'}`,suffix:stBadge(c.status)+icon('right',16)})).join('')}</div>`:'<p class="muted">미해결 카드가 없어요.</p>'}</section>
   <section>${secH(`매뉴얼로 만들 질문<span class="cnt">${pend}</span>`)}<p class="sec-d">근무자들이 반복해서 물어본 질문이에요. 승인하면 AI가 쓴 초안이 매장 매뉴얼이 돼요.</p>
    <div class="list">${S.faqs.map(f=>row({title:`“${esc(f.q)}”`,detail:`${f.n}회 질문 · 근무자 ${f.who}명`,suffix:f.approved?badge('매뉴얼 등록됨','positive'):btn('초안 보기',{v:'neutralSolid',s:'small',on:`draftManual('${f.id}')`})})).join('')}</div></section>
   <section>${secH('공지 고정')}<form class="send" style="margin:0" onsubmit="event.preventDefault();S.notice=this.n.value;notify('📌 공지 변경',S.notice);toast('공용 패드 맨 위에 고정됐어요');render()">${inp({name:'n',value:esc(S.notice)})}${btn('고정',{type:'submit'})}</form></section>
  </div><div class="col">
   <section>${secH('상태별 카드')}<div>${STATUS.map((s,i)=>{const L=C.filter(c=>c.status===i);return `<div class="strow"><span class="sb">${stBadge(i)}</span><span class="n">${L.length}</span><span class="ts">${L.map(c=>esc(c.title)).join(' · ')||'-'}</span></div>`}).join('')}</div></section>
   <section>${secH('인수인계 누락 건수',`<span class="aux">도입 전(회색) → 도입 후 · 파일럿 가정치</span>`)}
    <div class="bars">${[['전 1주',9,1],['전 2주',11,1],['1주차',5,0],['2주차',3,0],['3주차',2,0],['4주차',1,0]].map(([l,v,b])=>`<div class="b ${b?'before':''}"><em>${v}</em><i style="height:${v*9}px"></i>${l}</div>`).join('')}</div></section>
   <section>${secH('오늘 출퇴근 기록')}${attTable()}</section>
  </div></div>`;
}
const FAQ_DRAFT={
  f1:{key:'m-receipt',cat:'order',title:'영수증 용지 교체',type:'재고·발주',loc:'storage',locText:'창고 선반 A 맨 위 (흰 상자) · 프린터는 포스 오른쪽',purpose:'영수증 용지가 떨어지면 카드 결제 영수증을 못 뽑아요. 프린터 빨간불이 깜빡이면 바로 교체해요.',steps:['포스 오른쪽 프린터 덮개 버튼 누르기','다 쓴 심 빼고 새 롤을 종이 끝이 위로 오게 넣기','종이를 2cm 빼고 덮개 닫기','「FEED」 버튼으로 시험 출력','창고 재고가 3롤 이하면 사장님께 알리기'],cautions:['감열지라 거꾸로 넣으면 글자가 안 나와요'],terms:[['감열지','열로 글자가 찍히는 영수증 용지']]},
  f2:{key:'m-oat',cat:'etc',title:'오트밀크 재고 확인',type:'재고·발주',loc:'storage',locText:'창고 선반 B (두유 옆)',purpose:'오트밀크는 우유와 다른 거래처라 별도로 확인해요.',steps:['창고 선반 B에서 남은 팩 수 확인','4팩 이하면 발주 앱 「오트」 거래처 선택','6팩 단위로 발주'],cautions:['개봉 후 냉장 5일 이내 사용'],terms:[['거래처','물건을 납품하는 업체']]},
  f3:{key:'m-showcase',cat:'equip',title:'마감 시 쇼케이스 온도 설정',type:'청소·위생',loc:'showcase',locText:'카운터 앞 쇼케이스 하단 패널',purpose:'마감 후 케이크 보관 온도를 지켜야 다음 날 판매할 수 있어요.',steps:['하단 패널 「SET」 3초','온도를 3℃로 맞추기','조명 OFF, 커튼 내리기'],cautions:['5℃ 이상이면 사장님께 알리기'],terms:[['SET','설정 모드 버튼']]}
};
function draftManual(fid){
  const f=S.faqs.find(x=>x.id===fid), d=FAQ_DRAFT[fid];
  S.modal=()=>modal({wide:true,close:'S.modal=null;render()',pre:`<div class="tags" style="margin:0">${badge('AI가 쓴 매뉴얼 초안','brand','outline')}${catBadge(d.cat)}</div>`,title:esc(d.title),
    desc:`근무자 질문 “${esc(f.q)}” ${f.n}회에서 생성 · 「${CATS[d.cat].l}」 분류로 들어가요`,
    body:`<p style="margin-bottom:12px">${esc(d.purpose)}</p><div class="loc">${esc(d.locText)}</div>${steps(d.steps,true)}`,
    footer:btn('나중에',{s:'large',on:'S.modal=null;render()'})+btn('승인하고 매뉴얼에 추가',{v:'brandSolid',s:'large',on:`approve('${fid}')`})});
  render();
}
function approve(fid){const f=S.faqs.find(x=>x.id===fid),d=FAQ_DRAFT[fid];f.approved=true;S.manuals[d.key]={...d,views:0,isNew:true};S.modal=null;render();toast(`📘 「${d.title}」 매뉴얼이 ${CATS[d.cat].l}에 등록됐어요`)}

/* ---- [테스트] 퇴근 = 교대 마감 / 자동 승계 ---- */
function endShift(){
  const me=W(S.worker), nxt=W(me.next);
  const others=onDuty().filter(w=>w.id!==me.id);
  const open=S.cards.filter(c=>c.status<4), mine=S.cards.filter(c=>c.shift===S.shiftNo&&c.from===me.name), done=S.cards.filter(c=>c.status===4);
  S.modal=()=>modal({wide:true,title:`${me.name}님, 수고하셨어요`,desc:`${me.shift} · ${S.att[me.id]?S.att[me.id].in+' 출근 → ':''}${now()} 퇴근으로 기록할게요.`,
    body:`<div class="dstats"><div class="stat"><small>내가 남긴 카드</small><div class="v">${mine.length}</div></div><div class="stat"><small>완료</small><div class="v">${done.length}</div></div><div class="stat"><small>다음 교대로 승계</small><div class="v">${open.length}</div></div></div>
    ${secH(`${nxt.name}님(${nxt.shift.split(' ')[0]})에게 넘어가는 카드`)}
    ${others.length?`<p class="sec-d">함께 근무 중인 ${others.map(w=>w.name).join(', ')}님도 계속 볼 수 있어요.</p>`:''}
    <div class="hand" id="hand">${open.map(c=>`<div class="it"><b>${esc(c.title)}</b>${stBadge(c.status)}${c.shift===S.shiftNo?badge('새 카드','brand'):badge(`이월 ${c.carry+1}회차`,'warning')}</div>`).join('')}</div>`,
    footer:btn('계속 근무',{s:'large',on:'S.modal=null;render()'})+btn('퇴근하고 넘기기',{v:'brandSolid',s:'large',on:`doHandover('${nxt.id}')`})});
  render();
}
function doHandover(nid){
  document.querySelectorAll('#hand .it').forEach((e,i)=>{e.style.animationDelay=(i*.12)+'s';e.classList.add('go')});
  setTimeout(()=>{
    const meW=W(S.worker), me=meW.name;let n=0;
    if(S.clock<new Date(2026,10,19,13,0,0).getTime())S.clock=new Date(2026,10,19,13,1,10).getTime();
    S.cards.forEach(c=>{c.fresh=false;if(c.status<4){if(c.shift!==S.shiftNo)c.carry++;n++;if(c.status===1)c.status=0}});
    if(S.att[meW.id])S.att[meW.id].out=now();S.attLog.push({id:meW.id,kind:'out',t:now()});
    sysMsg(`${me}님이 퇴근했어요 · 미해결 ${n}건이 ${W(nid).name}님에게 넘어가요`);
    notify('🔁 퇴근 · 교대',`${me} → ${W(nid).name} · 미해결 ${n}건 자동 승계`);
    S.shiftNo++;S.bannerCarry=n;S.modal=null;S.worker=null;S.nextWorker=(S.att[nid]&&!S.att[nid].out)?null:nid;S.view='attend';
    render();
  },900);
}

/* ---- 점주 폰 (실시간 동기화 미리보기) ---- */
function renderPhone(){
  const el=$('#phone');if(!el)return;
  const fresh=S.notis.filter(n=>n.fresh).length;
  el.innerHTML=`<div class="lbl"><span class="live"></span> 점주 휴대폰 · 실시간 동기화</div><div class="phone"><div class="notch"></div>
  ${S.phonePush?`<div class="banner-push"><b>슬라이딩시프트 · 지금</b>${esc(clean(S.phonePush.title))}<br>${esc(S.phonePush.text)}</div>`:''}
  <div class="ph-top"><b>${OWNER}</b><div class="muted t2">카페 온기 성수점 · 근무 중 ${onDuty().length}명 · 미해결 ${openCount()}건</div>
  ${seg([['noti','알림'+(fresh?' •':'')],['chat','단체방']],S.phoneTab,k=>`S.phoneTab='${k}';renderPhone()`)}</div>
  ${S.phoneTab==='noti'?`<div class="body">${S.notis.map(n=>`<div class="noti ${n.fresh?'new':''}"><b>${esc(clean(n.title))}</b><span>${esc(n.text)}</span><small>${esc(n.t)}</small></div>`).join('')}</div>`:
   `<div class="body"><div class="roomt">카페 온기 성수점 단체방 · ${WORKERS.length+1}명</div><div class="msgs" id="pmsgs">${S.room.map(m=>bubble(m,true)).join('')}${S.phoneTyping?'<div class="msg me typing"><div class="bub"><i></i><i></i><i></i></div></div>':''}</div></div>
   <form class="send" onsubmit="event.preventDefault();ownerSend(this.m.value,null)">${inp({name:'m',ph:'단체방에 답장'})}${btn('보내기',{v:'brandSolid',type:'submit'})}</form>`}
  </div>`;
  S.notis.forEach(n=>{if(n.fresh)setTimeout(()=>{n.fresh=false},1500)});
  const pm=$('#pmsgs');if(pm)pm.scrollTop=pm.scrollHeight;
}
function togglePhone(){S.phone=!S.phone;render()}

/* ---- 네비게이션 ---- */
function go(v){if(v!=='rec-voice'){clearInterval(S.recTimer);stopSR()}S.view=v;if(v==='chat')S.afterRender=scrollMsgs;render();const c=$('#content');if(c&&v!=='chat')c.scrollTop=0}
function resetDemo(){clearInterval(S.recTimer);S=seed();render();toast('데모를 처음 상태로 되돌렸어요')}
// 메시지 보내면 폰은 자동으로 단체방 탭으로
const _notify=notify;notify=function(t,x){_notify(t,x);if(/💬/.test(t)){S.phoneTab='chat';renderPhone()}};

/* 시연 순서 도우미 (? 키) */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='?'){S.modal=S.modal?null:()=>modal({wide:true,close:'S.modal=null;render()',title:'시연 순서',
    body:`<ol class="helpol"><li><b>출퇴근 화면</b>: 김지윤·정하늘 2명 근무 중 → 김지윤 「이 패드 사용」</li><li>홈 → <b>음성으로 기록</b> (바로 실시간 음성 인식, 안 되면 기본 시나리오) → AI 정리 → 추가 질문 「오늘 중」 → 단체방에 카드 올라감</li>
    <li>단체방에 「오트밀크 3팩 남음 내일까지 발주」 입력 → AI 제안 → 카드로 만들기</li>
    <li><b>퇴근 · 교대 마감</b> → 미해결 카드 승계 → 출퇴근 화면에서 이민호 출근</li><li>단체 주문 카드 → 관련 레시피 (아메리카노·라떼) / 우유 카드 → 매뉴얼 → 완료</li><li>누수 카드 → 메시지 → 단체방·점주 폰에서 답장</li><li><b>업무 매뉴얼</b> 분류 탭 · 레시피 HOT/ICE · <b>점주 대시보드</b> 승인</li></ol>`,
    footer:`<span class="muted t2" style="margin-right:auto;align-self:center">단축키 <span class="kbd">?</span> · 왼쪽 아래 「데모 처음부터」로 초기화</span>`+btn('닫기',{on:'S.modal=null;render()'})});
   render()}
});
render();
